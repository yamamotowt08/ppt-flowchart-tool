<title>フローチャート作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic&family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 作業台：左に「手順書」、右は方眼の上に置いたスライド用紙 */
:root {
  --desk: #E8EDEB;
  --panel: #FBFCFB;
  --ink: #1E2A2D;
  --muted: #5B696D;
  --rule: #D0D9D6;
  --accent: #1D6A84;
  --accent-ink: #FFFFFF;
  --accent-soft: #DAEAEF;
  --grid: rgba(29, 106, 132, .08);
  --warn: #A3460F;
  --paper: #FFFFFF;
  --shadow: rgba(20, 40, 45, .14);
  --f-display: "Zen Kaku Gothic New", "Yu Gothic UI", "Meiryo UI", sans-serif;
  --f-body: "BIZ UDPGothic", "Meiryo UI", "Yu Gothic UI", "Hiragino Sans", sans-serif;
  --f-mono: "BIZ UDGothic", "MS Gothic", "Osaka-Mono", monospace;
  --lh-edit: 26px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #111718; --panel: #192124; --ink: #E2E9E7; --muted: #93A2A5; --rule: #2B373A;
    --accent: #66B6D1; --accent-ink: #0C181C; --accent-soft: #1C3440; --grid: rgba(102, 182, 209, .07);
    --warn: #E79B66; --paper: #FFFFFF; --shadow: rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #111718; --panel: #192124; --ink: #E2E9E7; --muted: #93A2A5; --rule: #2B373A;
  --accent: #66B6D1; --accent-ink: #0C181C; --accent-soft: #1C3440; --grid: rgba(102, 182, 209, .07);
  --warn: #E79B66; --paper: #FFFFFF; --shadow: rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--desk); color: var(--ink); font: 14px/1.6 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 28px; display: grid; gap: 14px; }

.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.brand { min-width: 0; }
.brand h1 { margin: 0; font: 700 22px/1.25 var(--f-display); letter-spacing: .04em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 700; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; border-color: var(--rule); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding-inline: 18px; }
.btn.primary:hover { filter: brightness(1.08); }
.btn .key { font-weight: 400; opacity: .75; font-size: 12px; margin-left: 6px; }

.bench { display: grid; grid-template-columns: minmax(0, 410px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 880px) { .bench { grid-template-columns: minmax(0, 1fr); } }

.sheet { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sheet-head h2 { margin: 0; font: 700 15px/1.3 var(--f-display); letter-spacing: .06em; }
.sheet-head select { max-width: 100%; }
select, input[type="text"] { background: var(--panel); border: 1px solid var(--rule); border-radius: 5px; padding: 5px 8px; min-width: 0; }

.inserts { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); background: var(--desk); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--accent); background: var(--accent-soft); }
.chip svg { width: 16px; height: 12px; flex: none; }
.chip svg * { fill: none; stroke: currentColor; stroke-width: 1.3; }

.editor { display: grid; grid-template-columns: 2.6em minmax(0, 1fr); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--panel); }
.gutter { background: var(--desk); border-right: 1px solid var(--rule); overflow: hidden; padding-block: 8px; font: 12px/var(--lh-edit) var(--f-mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; user-select: none; }
.gutter div { height: var(--lh-edit); padding-right: 7px; white-space: nowrap; }
.gutter .step { color: var(--accent); font-weight: 700; }
.gutter .lane { color: var(--accent); }
.gutter .err { color: var(--warn); }
.gutter .err::before { content: "!"; margin-right: 3px; }
textarea#src { display: block; width: 100%; height: 360px; resize: vertical; border: 0; outline: none; padding: 8px 10px; background: transparent; font: 14px/var(--lh-edit) var(--f-mono); white-space: pre; overflow: auto; tab-size: 2; }
.editor:focus-within { border-color: var(--accent); }

.msgs { display: grid; gap: 4px; font-size: 13px; min-height: 1em; }
.msgs .m { display: flex; gap: 8px; align-items: baseline; }
.msgs .m b { flex: none; font-variant-numeric: tabular-nums; }
.msgs .warn { color: var(--warn); }
.msgs .info { color: var(--muted); }

.howto { border-top: 1px solid var(--rule); padding-top: 8px; }
.howto summary { cursor: pointer; font-weight: 700; font-family: var(--f-display); letter-spacing: .04em; }
.howto table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
.howto td { border-top: 1px solid var(--rule); padding: 4px; vertical-align: top; }
.howto td:first-child { color: var(--muted); white-space: nowrap; padding-right: 12px; }
.howto td:last-child { font-family: var(--f-mono); color: var(--accent); }

.stage { display: grid; gap: 10px; min-width: 0; }
.opts { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; }
.opts label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.opts label.grow { flex: 1 1 200px; }
.opts label.grow input { flex: 1; }

.board { position: relative; border-radius: 8px; border: 1px solid var(--rule); overflow: hidden; }
.scroller { overflow: auto; max-height: 78vh; padding: 22px; background-color: var(--desk);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 16px 16px; }
.scroller.panning { cursor: grabbing; }
.paper { background: var(--paper); box-shadow: 0 1px 2px var(--shadow), 0 8px 24px var(--shadow); margin: 0 auto; }
.zoombar { position: absolute; top: 8px; right: 12px; z-index: 2; display: flex; align-items: center; gap: 2px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 2px; box-shadow: 0 2px 8px var(--shadow); }
.zoombar button { border: 0; background: none; border-radius: 4px; min-width: 30px; height: 28px; cursor: pointer; font-weight: 700; padding: 0 8px; }
.zoombar button:hover { background: var(--accent-soft); }
.linepop { position: absolute; z-index: 3; display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 4px 6px; box-shadow: 0 4px 14px var(--shadow); font-size: 13px; }
.linepop .lbl { color: var(--muted); padding: 0 4px; }
.linepop button { border: 1px solid var(--rule); background: var(--panel); border-radius: 5px; padding: 3px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.linepop button svg { width: 22px; height: 6px; }
.linepop button svg line { stroke: currentColor; stroke-width: 2; }
.linepop button[data-del] { color: var(--warn); }
.linepop button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.zoombar .pct { min-width: 3.4em; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.paper svg { display: block; width: 100%; height: auto; }
.paper .node { cursor: grab; touch-action: none; }
.paper .dot { cursor: move; touch-action: none; }
.paper .wire { touch-action: none; }
.paper .end { cursor: crosshair; touch-action: none; }
.paper .end:hover, .paper .end.on { fill-opacity: .55; }
.paper .sub { cursor: grab; }
.paper .sub.moving { opacity: .75; }
.paper .node.drop .shape { stroke: #E0752D; stroke-width: 3; }
.paper .wire:hover { stroke-opacity: .12; }
.paper .dot:hover circle:last-child { r: 4.5; }
.paper.dragging .node { cursor: grabbing; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 13px; }
.paper .node:hover .shape { stroke-width: 2.6; }
.paper .node.cur .shape { stroke: #E0752D; stroke-width: 2.8; }
.empty { fill: #8A979A; font-size: 16px; }
.stats { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.stats .n { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 700; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 8px; box-shadow: 0 6px 20px var(--shadow); display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); z-index: 10; }
.toast button { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; font-weight: 700; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .18s ease-out; } @keyframes rise { from { transform: translate(-50%, 8px); opacity: .4; } } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>フローチャート作成</h1>
      <p>手順を書くと、その場で図ができます。PowerPoint の図形のまま保存できます。</p>
    </div>
    <div class="actions">
      <button id="btnUndo" class="btn" type="button" title="元に戻す（Ctrl+Z）" disabled>↶ 元に戻す</button>
      <button id="btnRedo" class="btn" type="button" title="やり直す（Ctrl+Y）" disabled>↷ やり直す</button>
      <button id="btnCopy" class="btn" type="button">画像をコピー</button>
      <button id="btnSave" class="btn primary" type="button">PowerPoint で保存<span class="key">Ctrl+S</span></button>
    </div>
  </header>

  <main class="bench">
    <section class="sheet" aria-labelledby="hSteps">
      <div class="sheet-head">
        <h2 id="hSteps">手順</h2>
        <select id="sample" aria-label="サンプルを入れる">
          <option value="">サンプルを入れる…</option>
          <option value="blank">白紙にする</option>
          <option value="word">業務フロー（Word の例）</option>
          <option value="gyomu">業務の流れ（例）</option>
          <option value="shinsei">申請と承認（例）</option>
          <option value="chumon">注文の受付（例）</option>
        </select>
      </div>

      <div class="inserts" role="toolbar" aria-label="行を追加">
        <button class="chip" type="button" data-ins="proc" title="作業（箱）を 1 つ足します"><svg viewBox="0 0 16 12"><rect x="1" y="2" width="14" height="8"/></svg>作業</button>
        <button class="chip" type="button" data-ins="sub"><svg viewBox="0 0 16 12"><rect x="1" y="1" width="14" height="10"/><rect x="3.5" y="5" width="9" height="4"/></svg>小項目</button>
        <button class="chip" type="button" data-ins="memo"><svg viewBox="0 0 16 12"><circle cx="3" cy="6" r="1.6"/><path d="M5 6H9"/><rect x="9.5" y="3" width="6" height="6"/></svg>照査・打合せ</button>
        <button class="chip" type="button" data-ins="meet"><svg viewBox="0 0 16 12"><circle cx="3" cy="6" r="1.6"/><path d="M5 6H9"/><rect x="9.5" y="3" width="6" height="6"/></svg>打合せ</button>
        <button class="chip" type="button" data-ins="side"><svg viewBox="0 0 16 12"><path d="M14 1V11M14 3H4V8"/><rect x="1" y="8" width="6" height="3.5"/></svg>並行（左）</button>
        <button class="chip" type="button" data-ins="branch" title="右に分かれる箱を足します。名前は自由で、番号は付きません"><svg viewBox="0 0 16 12"><circle cx="3" cy="6" r="1.6"/><path d="M5 6H9"/><rect x="9.5" y="3" width="6" height="6"/></svg>枝分かれ</button>
      </div>

      <div class="editor">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <textarea id="src" wrap="off" spellcheck="false" aria-label="手順（1 行に 1 つ）" placeholder="ここに手順を 1 行に 1 つ書きます&#10;例）&#10;開始&#10;書類を作る&#10;終了"></textarea>
      </div>
      <div id="msgs" class="msgs" aria-live="polite"></div>

      <details class="howto" id="howto">
        <summary>書き方</summary>
        <table>
          <tr><td>作業</td><td>1 行に 1 つ書く</td></tr>
          <tr><td>小項目</td><td>・小項目</td></tr>
          <tr><td>照査・打合せ</td><td>@照査、打合せ</td></tr>
          <tr><td>打合せ</td><td>@打合せ</td></tr>
          <tr><td>並行（左）</td><td>&lt; 作業 &gt; 合流先</td></tr>
          <tr><td>枝分かれ</td><td>@名前（名前は自由。①②は名前が「照査」「打合せ」だけのものに付く）</td></tr>
          <tr><td>左に枝分かれ</td><td>@&lt;名前（図の上で箱を本線の反対側へドラッグしても切り替わる）</td></tr>
        </table>
      </details>
    </section>

    <section class="stage" aria-label="プレビュー">
      <div class="opts">
        <label>スライド
          <select id="optSize">
            <option value="w169">16:9</option>
            <option value="s43">4:3</option>
            <option value="a4p">A4 縦</option>
            <option value="a4l">A4 横</option>
          </select>
        </label>
        <label>色
          <select id="optStyle">
            <option value="gyomu">業務フロー（黄色）</option>
            <option value="color">カラー</option>
            <option value="mono">白黒（資料向け）</option>
          </select>
        </label>
        <label>文字
          <select id="optFont">
            <option value="meiryoui">Meiryo UI</option>
            <option value="meiryo">メイリオ</option>
            <option value="bizud">BIZ UDPゴシック</option>
            <option value="mspg">ＭＳ Ｐゴシック</option>
            <option value="yu">游ゴシック</option>
          </select>
        </label>
        <label class="grow">タイトル <input id="optTitle" type="text" placeholder="なしでも大丈夫です"></label>
      </div>
      <div class="board">
        <div class="zoombar" role="toolbar" aria-label="ズーム">
          <button id="zOut" type="button" title="小さく">－</button>
          <span id="zPct" class="pct">100%</span>
          <button id="zIn" type="button" title="大きく">＋</button>
          <button id="zFit" type="button" title="全体を表示">全体</button>
        </div>
        <div class="linepop" id="linePop" role="toolbar" aria-label="線の種類" hidden>
          <span class="lbl">線</span>
          <button type="button" data-ls="solid"><svg viewBox="0 0 22 6"><line x1="0" y1="3" x2="22" y2="3"/></svg>実線</button>
          <button type="button" data-ls="dashed"><svg viewBox="0 0 22 6"><line x1="0" y1="3" x2="22" y2="3" stroke-dasharray="4 3"/></svg>点線</button>
          <button type="button" data-del title="この線を消す（Delete）">消す</button>
        </div>
        <div class="scroller" id="scroller"><div class="paper" id="paper"></div></div>
      </div>
      <div class="stats">
        <span id="stats"></span>
        <span>箱・黒い点・線はドラッグで動かせます（手順の欄も一緒に変わります）。<button id="btnReset" class="linkbtn" type="button" hidden>配置を元に戻す</button> <button id="btnShowLines" class="linkbtn" type="button" hidden>消した線を戻す</button></span>
      </div>
    </section>
  </main>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
"use strict";
const TEMPLATE = __PPTX_TEMPLATE__;

// ---------- 設定 ----------
const SIZES = { w169: [960, 540], s43: [720, 540], a4p: [540, 780], a4l: [780, 540] };
// head=小項目つきの見出し / body=小項目の外枠 / sub=小項目 / notes=照査・打合せなど
const STYLES = {
  gyomu: { proc: ["FFFF99", "000000"], term: ["FFFF99", "000000"], dec: ["FFFF99", "000000"], text: "000000", arrow: "000000", lineW: 1,
           head: "FFFF99", body: "FFFFFF", sub: ["FFFFFF", "000000"], notes: { check: "CCFFFF", meet: "FF99CC", other: "F2F2F2" } },
  color: { proc: ["DEEBF7", "2E75B6"], term: ["E2EFDA", "548235"], dec: ["FFF2CC", "BF9000"], text: "262626", arrow: "595959", lineW: 1.5,
           head: "DEEBF7", body: "FFFFFF", sub: ["FFFFFF", "2E75B6"], notes: { check: "DDF2F7", meet: "FBE3EC", other: "F2F2F2" } },
  mono:  { proc: ["FFFFFF", "000000"], term: ["FFFFFF", "000000"], dec: ["FFFFFF", "000000"], text: "000000", arrow: "000000", lineW: 1,
           head: "FFFFFF", body: "FFFFFF", sub: ["FFFFFF", "000000"], notes: { check: "FFFFFF", meet: "FFFFFF", other: "FFFFFF" } },
};
const FONTS = {
  meiryoui: ["Meiryo UI", '"Meiryo UI", Meiryo, "BIZ UDPGothic", sans-serif'],
  meiryo:   ["メイリオ", 'Meiryo, "メイリオ", "BIZ UDPGothic", sans-serif'],
  bizud:    ["BIZ UDPゴシック", '"BIZ UDPGothic", "BIZ UDPゴシック", sans-serif'],
  mspg:     ["ＭＳ Ｐゴシック", '"MS PGothic", "ＭＳ Ｐゴシック", "BIZ UDPGothic", sans-serif'],
  yu:       ["游ゴシック", '"Yu Gothic", "游ゴシック", YuGothic, "BIZ UDPGothic", sans-serif'],
};
const LH = 1.25;
const START_WORDS = ["開始", "スタート", "START", "BEGIN", "はじめ", "始め", "始まり"];
const END_WORDS = ["終了", "終わり", "おわり", "完了", "END", "STOP", "エンド", "ゴール", "業務納品", "納品"];
// 「いいえ」の処理のあと、元の流れに戻るか戻らないか
const BACK_WORDS = ["戻る", "もどる", "合流"];
const STAY_WORDS = ["戻らない", "もどらない", "合流しない", "×", "✕"];
const NO_LINE_START = "、。，．）」』】〕！？!?・ーぁぃぅぇぉっゃゅょァィゥェォッャュョ";

const SAMPLES = {
  word: "※ 例：業務フロー（Word の例をもとにしています）\n設計計画\n@照査、打合せ\n現地踏査\n基本事項の検討\n@打合せ\n・あああああ\n@打合せ\n・いいいいい\n@打合せ\n・構造物との取付検討\n@打合せ\n組み合わせ検討\n本体設計\n・基礎工検討諸元の整理\n・安定計算\n< ○○対策設計 > 図面作成\n・洗掘防止対策の検討\n・対策設計\n・河道断面の計算\n付帯施設設計\n・階段\n@照査、打合せ\n施工計画\n・施工計画、仮設計画\n図面作成\n・図面作成\n数量計算\n報告書作成\n@照査、打合せ\n業務納品",
  gyomu: "※ 例：調査業務の流れ（自由に書き換えてください）\n開始\n打合せ\n| 現地踏査 → 写真・データ整理\n| 既存資料の収集 → 資料整理\n| 関係機関への照会\n図面・資料作成\n社内照査はOK？ > 修正する > #4\n発注者協議\n協議で了承された？ > 修正対応 > #4\n報告書提出\n終了",
  shinsei: "※ 例：申請と承認\n開始\n申請書を書く\n内容は正しい？ > 書き直す > #2\n上司の承認は得た？ > 差し戻し対応 > 再申請する > #2\n予算内？ > 終了\n発注する\n納品を確認する\n終了",
  chumon: "※ 例：注文の受付\n開始\n注文を受け付ける\n会員登録済み？ > 会員登録をしてもらう\n在庫はある？ > 取り寄せる > #4\n商品を発送する\n終了",
};

// ---------- 読み取り ----------
const clean = s => s.replace(/^[\s　]+|[\s　]+$/g, "");
const toHalf = s => s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
function isWord(t, list) {
  t = clean(t).toUpperCase().replace(/[。.!！]+$/, "");
  return t !== "" && list.includes(t);
}
function classify(raw) {
  let t = clean(raw), kind = "proc", forced = false;
  // 形の指定は「○ 受付完了」のように記号のあとに空白があるときだけ（「○○対策」はそのまま）
  const f = /^[○◯◇◆□■][\s　]/.test(t) ? t.charAt(0) : "";
  if (f && "○◯".includes(f)) { kind = "term"; forced = true; }
  else if (f && "◇◆".includes(f)) { kind = "dec"; forced = true; }
  else if (f && "□■".includes(f)) { forced = true; }
  if (forced) t = clean(t.slice(1));
  else if (/[？?]$/.test(t)) kind = "dec";
  else if (isWord(t, START_WORDS) || isWord(t, END_WORDS)) kind = "term";
  return { text: t, kind, isEnd: kind === "term" && isWord(t, END_WORDS) };
}

const LANE_RE = /^[|｜]\s*/;          // 同時進行の列（1 行が 1 列、→ で同じ列の次の作業）
const SUB_RE = /^[・･\-*]\s*/;         // 小項目（直前の手順の中に入る）
const SIDE_RE = /^[<＜]\s*/;          // 左に並行して進む手順（> で合流先）
const NOTE_RE = /^[@＠]\s*/;          // 照査・打合せなど（右に付く。「@<」で始めると左に付く）
const NOTE_LEFT_RE = /^[@＠]\s*[<＜]\s*/;
// 「@」の行の名前の並びと、左右（左なら true）
const noteLine = t => { t = clean(t); const left = NOTE_LEFT_RE.test(t); return { left, items: t.replace(left ? NOTE_LEFT_RE : NOTE_RE, "").split(/[、,，・\/／]/).map(clean).filter(Boolean) }; };

const NUM_RE = /^[0-9０-９]+[.．)）、:：](?![0-9０-９])\s*/;
const SUBNUM_RE = /^[（(][0-9０-９]+[)）]\s*/;

function parse(src, autoNum, ids) {
  const idOf = i => (ids && ids[i]) || `L${i}`;
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  const units = [], sides = [], lineInfo = [];
  let block = null, side = null, lastMain = null, lastStep = null;
  // 手順（黄色い箱）には番号を付けない。手で書いた番号はそのまま出す
  const stepText = t => t;
  const subText = t => (autoNum ? clean(t.replace(SUBNUM_RE, "").replace(NUM_RE, "")) : t);

  lines.forEach((ln, i) => {
    let s = clean(ln);
    if (!s) { lineInfo.push({ type: "blank" }); return; }
    if (/^(※|'|\/\/)/.test(s)) { lineInfo.push({ type: "note" }); return; }

    if (NOTE_RE.test(s)) {
      const { items, left } = noteLine(s);
      // 見出しのすぐ後 → 見出しの横 / 小項目の間 → その間 / 最後 → 次の手順との間
      if (lastMain && items.length) lastMain.notes.push({ pos: lastStep === lastMain ? lastMain.subs.length : Infinity, items, left, line: i, uid: idOf(i) });
      lineInfo.push({ type: "memo" });
      return;
    }
    if (SUB_RE.test(s) && lastStep) {
      const t = clean(s.replace(SUB_RE, ""));
      if (t) lastStep.subs.push({ text: subText(t), line: i });
      lineInfo.push({ type: "sub" });
      return;
    }
    if (LANE_RE.test(s)) {
      const lane = s.replace(LANE_RE, "").split(/→|->|⇒|＞|>/).map(clean).filter(Boolean)
        .map((t, k) => Object.assign(classify(stepText(t)), { line: i, subs: [], uid: `${idOf(i)}|${k}` }));
      if (!block) {
        block = { kind: "block", lanes: [], line: i, notes: [], subs: [], uid: idOf(i) };
        units.push(block);
        lineInfo.push({ type: "lane", n: units.length });
      } else {
        lineInfo.push({ type: "lane" });
      }
      block.lanes.push(lane.length ? lane : [Object.assign(classify(""), { line: i, subs: [] })]);
      side = null; lastStep = null; lastMain = block;
      return;
    }
    if (SIDE_RE.test(s) && lastMain && lastMain.kind !== "block") {
      const t = s.replace(SIDE_RE, "").replace(/＞/g, ">");
      const p = t.indexOf(">");
      const head = p >= 0 ? t.slice(0, p) : t;
      const target = p >= 0 ? clean(t.slice(p + 1).split(">")[0]) : "";
      if (!side) { side = { after: lastMain, items: [], target: "", line: i }; sides.push(side); }
      if (target) side.target = target;
      for (const [k, part] of head.split(/→|->|⇒/).map(clean).filter(Boolean).entries()) {
        const st = Object.assign(classify(stepText(part)), { subs: [], line: i, uid: `${idOf(i)}|<${k}` });
        side.items.push(st);
        lastStep = st;
      }
      block = null;
      lineInfo.push({ type: "side" });
      return;
    }

    block = null; side = null;
    if (SUB_RE.test(s)) s = clean(s.replace(SUB_RE, ""));
    if (SIDE_RE.test(s)) s = clean(s.replace(SIDE_RE, ""));
    const t = s.replace(/＞/g, ">");
    const p = t.indexOf(">");
    const head = p >= 0 ? t.slice(0, p) : t;
    const chain = p >= 0 ? t.slice(p + 1).split(">").map(clean).filter(Boolean) : [];
    const u = Object.assign(classify(stepText(clean(head))), { chain, line: i, subs: [], notes: [], uid: idOf(i) });
    units.push(u);
    lastMain = lastStep = u;
    lineInfo.push({ type: "step", n: units.length });
  });
  return { units, sides, lineInfo };
}

function findTarget(it, units) {
  if (/^[#＃]/.test(it)) {
    const m = it.match(/^[#＃]\s*([0-9０-９]+)/);
    if (!m) return { error: `「${it}」の番号が読めません。#3 のように書いてください。` };
    const n = parseInt(toHalf(m[1]), 10);
    if (n < 1 || n > units.length) return { error: `#${n} の手順はありません（手順は 1〜${units.length}）。` };
    return { index: n - 1 };
  }
  if (isWord(it, START_WORDS) || isWord(it, END_WORDS)) return { index: -1 };
  const t = clean(it.replace(NUM_RE, ""));
  return { index: units.findIndex(u => u.kind !== "block" && (u.text === it || u.text === t)) };
}

// 図形（nodes）と矢印（edges）を作る
function buildGraph(units, sides) {
  const nodes = [], edges = [], msgs = [], M = units.length;
  const entry = [], exit = [];
  const add = n => nodes.push(n) - 1;
  units.forEach((u, i) => {
    if (u.kind !== "block") {
      entry[i] = exit[i] = add(Object.assign({}, u, { unit: i, col: 0 }));
      return;
    }
    u.fork = add({ kind: "bar", unit: i, line: u.line, key: `${u.uid}|f` });
    u.laneNodes = u.lanes.map((lane, j) => lane.map(s => add(Object.assign({}, s, { unit: i, lane: j }))));
    u.join = add({ kind: "bar", unit: i, line: u.line, join: true, key: `${u.uid}|j` });
    entry[i] = u.fork;
    exit[i] = u.join;
    for (const l of u.laneNodes) {
      edges.push({ a: u.fork, b: l[0], type: "down" });
      let k = 0;
      for (; k < l.length - 1 && !nodes[l[k]].isEnd; k++) edges.push({ a: l[k], b: l[k + 1], type: "down" });
      if (k === l.length - 1 && !nodes[l[k]].isEnd) edges.push({ a: l[k], b: u.join, type: "down" });
    }
  });

  const branch = [];
  for (let i = 0; i < M; i++) {
    const u = units[i], cur = exit[i];
    if (i < M - 1 && !(u.kind !== "block" && u.isEnd)) edges.push({ a: cur, b: entry[i + 1], type: "down" });
    branch[i] = false;
    if (u.kind === "block" || !u.chain.length) continue;
    let prv = cur, col = 0, jumped = false, stay = false;
    for (const it of u.chain) {
      if (isWord(it, STAY_WORDS)) { stay = true; break; }
      if (isWord(it, BACK_WORDS)) break;
      const tgt = findTarget(it, units);
      if (tgt.error) { msgs.push({ line: u.line, level: "warn", text: tgt.error }); break; }
      if (tgt.index >= 0) {
        edges.push({ a: prv, b: entry[tgt.index], type: prv !== cur && tgt.index === i + 1 ? "merge" : "jump" });
        jumped = true;
        break;
      }
      col++;
      const n = add(Object.assign(classify(it), { unit: i, col, line: u.line, side: true, subs: [], uid: `${u.uid}|s${col}` }));
      edges.push({ a: prv, b: n, type: "right" });
      prv = n;
    }
    if (!jumped && !stay && prv !== cur && i < M - 1 && !nodes[prv].isEnd) edges.push({ a: prv, b: entry[i + 1], type: "merge" });
    branch[i] = jumped || prv !== cur;
  }

  // 左に並行して進む手順
  const sideLanes = [];
  for (const sd of sides) {
    const from = units.indexOf(sd.after);
    let to = from + 1;
    if (sd.target) {
      const t = findTarget(sd.target, units);
      if (t.error) msgs.push({ line: sd.line, level: "warn", text: t.error });
      else if (t.index < 0) msgs.push({ line: sd.line, level: "warn", text: `合流先の「${sd.target}」という手順が見つかりません。` });
      else if (t.index <= from) msgs.push({ line: sd.line, level: "warn", text: "合流先は、分かれた手順より下の手順にしてください。" });
      else to = t.index;
    }
    const ids = sd.items.map(it => add(Object.assign({}, it, { sideLane: true })));
    for (let k = 0; k < ids.length - 1 && !nodes[ids[k]].isEnd; k++) edges.push({ a: ids[k], b: ids[k + 1], type: "down" });
    sideLanes.push({ from, to: to < M ? to : -1, ids, line: sd.line });
  }

  const lonely = units.findIndex((u, i) => u.kind === "dec" && !branch[i]);
  if (lonely >= 0 && !msgs.length) {
    msgs.push({ line: units[lonely].line, level: "info", text: "判断（？）に「いいえ」の行き先がありません。行の最後に「> 処理」や「> #番号」を付けると右に分かれます。" });
  }
  return { nodes, edges, msgs, units, entry, exit, branch, sideLanes, M };
}

// ---------- 文字の折り返し ----------
const mctx = document.createElement("canvas").getContext("2d");
function textWidth(t, fs, fam) { mctx.font = `${fs}px ${fam}`; return mctx.measureText(t).width; }
function wrap(text, maxW, fs, fam) {
  const lines = []; let cur = "";
  for (const ch of Array.from(text)) {
    if (cur && textWidth(cur + ch, fs, fam) > maxW && !NO_LINE_START.includes(ch)) { lines.push(cur); cur = ch; }
    else cur += ch;
  }
  if (cur || !lines.length) lines.push(cur);
  return lines;
}
// 文字を入れる枠（図形の形ごと）
function textBox(t) {
  if (t.look === "dec") return { w: t.w * 0.5, h: t.h * 0.62, ins: 0 };
  if (t.look === "term") return { w: t.w * 0.906 - 6, h: t.h * 0.86, ins: 3 };
  return { w: t.w - 6, h: t.h - 2, ins: 3 };
}
function fitSize(t, base, fam) {
  const tb = textBox(t);
  for (let fs = base; fs >= 6; fs -= 0.5) {
    const lines = wrap(t.label, tb.w, fs, fam);
    if (lines.length * fs * LH <= tb.h && lines.every(l => textWidth(l, fs, fam) <= tb.w + 0.5)) return fs;
  }
  return 6;
}
// 同じ種類の文字はできるだけ同じ大きさにそろえる
function fitGroup(items, base, fam) {
  if (!items.length) return;
  const fits = items.map(t => fitSize(t, base, fam));
  const uni = Math.max(Math.min(...fits), base * 0.7);
  items.forEach((t, i) => {
    t.fs = Math.min(uni, fits[i]);
    t.wrapped = wrap(t.label, textBox(t).w, t.fs, fam);
  });
}

// ---------- 配置（単位：pt） ----------
// 高さは「1 段 = 1」の割合で決めてから、スライドに収まるように拡大する
const A = { box: 0.55, gap: 0.45, dec: 0.8, bar: 0.45, hdr: 0.5, pad: 0.14, sub: 0.46, subGap: 0.26, note: 0.42, noteGap: 0.14 };
const isShape = n => n.kind !== "bar";
const topOf = n => n.y - n.h / 2;
const bottomOf = n => n.y + n.h / 2;
const hasSubs = n => !!(n.subs && n.subs.length);
// 上から順（ほぼ同じ高さのものは、書いた順）に並べる
function byPosition(items) {
  const sorted = items.slice().sort((a, b) => topOf(a) - topOf(b));
  const out = [];
  for (let i = 0; i < sorted.length;) {
    const tol = Math.max(3, sorted[i].h * 0.3);
    let j = i + 1;
    while (j < sorted.length && topOf(sorted[j]) - topOf(sorted[i]) < tol) j++;
    out.push(...sorted.slice(i, j).sort((a, b) => a.line - b.line || (a.idx ?? 0) - (b.idx ?? 0)));
    i = j;
  }
  return out;
}
const CIRCLED = k => (k >= 1 && k <= 20 ? String.fromCharCode(0x2460 + k - 1) : `(${k})`);

function layout(g, o) {
  const [W, H] = SIZES[o.size];
  const L = { W, H, nodes: g.nodes, lines: [], notes: [], dots: [], title: null, fam: FONTS[o.font][1] };
  if (o.title) L.title = { x: W * 0.04, y: H * 0.045, fs: Math.min(24, H * 0.045), text: o.title };
  if (!g.M) return L;

  // 形と文字（番号）
  g.nodes.forEach((n, idx) => { n.idx = idx; });
  for (const n of g.nodes) {
    if (!isShape(n)) continue;
    n.look = "proc";   // 箱はすべて四角
    n.label = n.text;
  }

  // 縦の大きさ（割合）
  const contH = n => A.hdr + A.pad * 2 + n.subs.length * A.sub + (n.subs.length - 1) * A.subGap + (n.stretch || 0);
  const hOf = n => (hasSubs(n) ? contH(n) : n.look === "dec" ? A.dec : A.box);
  const slotOf = n => (hasSubs(n) ? contH(n) + A.gap : 1);
  const depth = u => Math.max(...u.lanes.map(l => l.length));
  const extra = new Array(g.M).fill(0);
  const slotTop = [];
  const place = () => {
    let y = 0;
    g.units.forEach((u, i) => {
      slotTop[i] = y;
      if (u.kind === "block") {
        const d = depth(u);
        g.nodes[u.fork].ay = y + A.bar / 2;
        u.laneNodes.forEach(l => l.forEach((ni, r) => { g.nodes[ni].ay = y + A.bar + r + 0.5; }));
        g.nodes[u.join].ay = y + A.bar + d + A.bar / 2;
        y += d + 2 * A.bar + extra[i];
      } else {
        const n = g.nodes[g.entry[i]];
        n.ay = y + slotOf(n) / 2;
        y += slotOf(n) + extra[i];
      }
    });
    return y;
  };
  let total = place();

  // 左の並行手順：合流まで届かなければ間を広げ、余るときは 1 つだけなら縦に伸ばす
  for (const sl of g.sideLanes) {
    const need = sl.ids.reduce((s, ni) => s + slotOf(g.nodes[ni]), 0);
    const start = slotTop[sl.from];
    if (sl.to < 0) continue;
    const room = slotTop[sl.to] - start;
    if (need > room) { extra[sl.to - 1] += need - room; total = place(); }
    else if (sl.ids.length === 1 && hasSubs(g.nodes[sl.ids[0]])) g.nodes[sl.ids[0]].stretch = room - need;
  }
  for (const sl of g.sideLanes) {
    let y = slotTop[sl.from];
    for (const ni of sl.ids) { const n = g.nodes[ni]; n.ay = y + slotOf(n) / 2; y += slotOf(n); }
    total = Math.max(total, y);
  }

  // 横の並び：左に並行手順・同時進行、真ん中が本線、右に「いいえ」の処理と照査・打合せ
  const sideCol = [];
  const used = [];
  for (const sl of g.sideLanes) {
    const end = sl.to < 0 ? g.M : sl.to;
    let c = 1;
    while ((used[c] || []).some(r => !(end <= r[0] || sl.from >= r[1]))) c++;
    (used[c] = used[c] || []).push([sl.from, end]);
    sideCol.push(c);
  }
  let minOff = -Math.max(0, ...sideCol), maxOff = 0;
  for (const n of g.nodes) if (n.side) maxOff = Math.max(maxOff, n.col);
  for (const u of g.units) if (u.kind === "block") { const h = (u.lanes.length - 1) / 2; minOff = Math.min(minOff, -h); maxOff = Math.max(maxOff, h); }
  // 照査・打合せ（枝分かれ）の列：右と、「@<」の行があれば左にも
  const hasNote = left => g.units.some(u => (u.notes || []).some(nt => !!nt.left === left));
  const noteColsR = hasNote(false) ? 0.85 : 0, noteColsL = hasNote(true) ? 0.85 : 0;

  const aL = W * 0.04, aR = W - W * 0.04, aT = o.title ? H * 0.15 : H * 0.05, aB = H - H * 0.05;
  const cols = maxOff - minOff + 1 + noteColsR + noteColsL;
  const jumps = g.edges.filter(e => e.type === "jump").length;
  const laneSpace = jumps ? 14 + 12 * jumps : 0;
  const cp = Math.min((aR - aL - laneSpace) / cols, 250);
  const s = Math.min((aB - aT) / total, 90);
  const boxW = cp * 0.7;
  const left = aL + ((aR - aL) - (cols * cp + laneSpace)) / 2;
  const mainX = left + cp * (-minOff + 0.5 + noteColsL);
  const top = aT + ((aB - aT) - total * s) / 2;
  const Y = a => top + a * s;

  const size = n => {
    if (hasSubs(n)) { n.w = boxW; n.h = contH(n) * s; }
    else if (n.look === "dec") { n.w = boxW * 1.15; n.h = A.dec * s; }
    else if (n.look === "term") { n.w = boxW * 0.8; n.h = A.box * s; }
    else { n.w = boxW; n.h = A.box * s; }
  };
  g.units.forEach((u, i) => {
    if (u.kind !== "block") { const n = g.nodes[g.entry[i]]; size(n); n.x = mainX; n.y = Y(n.ay); return; }
    const k = u.lanes.length;
    const xs = u.lanes.map((l, j) => mainX + (j - (k - 1) / 2) * cp);
    const x1 = Math.min(...xs) - boxW * 0.35, x2 = Math.max(...xs) + boxW * 0.35;
    for (const b of [u.fork, u.join]) Object.assign(g.nodes[b], { x: mainX, x1, x2, w: x2 - x1, h: Math.max(2.5, s * 0.06), y: Y(g.nodes[b].ay) });
    u.laneNodes.forEach((l, j) => l.forEach(ni => { const n = g.nodes[ni]; size(n); n.x = xs[j]; n.y = Y(n.ay); }));
  });
  g.sideLanes.forEach((sl, k) => sl.ids.forEach(ni => { const n = g.nodes[ni]; size(n); n.x = mainX - sideCol[k] * cp; n.y = Y(n.ay); }));
  for (const n of g.nodes) {
    if (!n.side) continue;
    size(n);
    n.x = mainX + n.col * cp;
    n.y = g.nodes[g.entry[n.unit]].y;
  }
  L.mainX = mainX; L.cp = cp;   // ドラッグで落とした先を決めるのに使う

  // 照査・打合せの箱（右の列。「@<」の行は左の列）
  const noteW = boxW * 0.62, noteH = A.note * s;

  const counts = {};
  const groups = [];
  g.units.forEach((u, i) => {
    if (!u.notes || !u.notes.length) return;
    for (const grp of u.notes) {
      const items = grp.items.map(t => {
        const base = clean(t);
        counts[base] = (counts[base] || 0) + 1;
        const label = o.num && NUMBERED_NOTE_RE.test(base) ? base + CIRCLED(counts[base]) : base;
        const cat = /照査/.test(base) ? "check" : /打合|打ち合|協議|会議/.test(base) ? "meet" : "other";
        return { kind: "note", text: base, label, cat, line: grp.line, look: "proc", w: noteW, h: noteH, unit: i, pos: grp.pos, left: !!grp.left, uid: `${grp.uid}|n${grp.items.indexOf(t)}` };
      });
      groups.push({ unit: i, pos: grp.pos, items, line: grp.line, uid: grp.uid, left: !!grp.left });

  // ドラッグで動かした分を足す。どの図形かは「行」で覚えるので、文字を書き換えても消えない
  const seen = {};
  L.moved = 0;
  const applyOffset = n => {
    const base = n.uid || `${n.kind === "note" ? "@" : ""}${n.text}|${n.lane ?? ""}|${n.side ? n.col : ""}|${n.sideLane ? "<" : ""}`;
    seen[base] = (seen[base] || 0) + 1;
    n.key = seen[base] > 1 ? `${base}|${seen[base]}` : base;
    n.nx = n.x; n.ny = n.y;   // 動かす前の位置
    const off = o.offsets[n.key];
    if (off) { n.x += off[0]; n.y += off[1]; L.moved++; inPaper(n, n.w / 2, n.h / 2); }
  };
  // 動かした図形は紙の外に出さない（はみ出して見切れないように）
  const inPaper = (n, hw, hh) => {
    n.x = Math.min(Math.max(n.x, hw + 2), W - hw - 2);
    n.y = Math.min(Math.max(n.y, hh + 2), H - hh - 2);
  };
  g.nodes.filter(isShape).forEach(applyOffset);
  // 点（照査・打合せや並行作業が本線につく所）も動かせる。動かした分は点の位置そのもの
  const placeDot = (d, name) => {
    d.x0 = d.x; d.y0 = d.y;
    const base = `●${name}`;
    seen[base] = (seen[base] || 0) + 1;
    d.key = seen[base] > 1 ? `${base}|${seen[base]}` : base;
    const off = o.offsets[d.key];
    if (off) { d.x += off[0]; d.y += off[1]; L.moved++; inPaper(d, 3, 3); }
    return d;
  };

  // 小項目の位置（外枠の中に縦に並べる）
  for (const n of g.nodes) {
    if (!isShape(n) || !hasSubs(n)) continue;
    const x0 = n.x - n.w / 2, t0 = topOf(n);
    n.head = { x: n.x, y: t0 + (A.hdr * s) / 2, w: n.w, h: A.hdr * s, look: "proc", label: n.label };
    const k = n.subs.length;
    const gapS = (A.subGap + (n.stretch || 0) / Math.max(1, k - 1)) * s;
    const firstTop = t0 + (A.hdr + A.pad) * s + (k === 1 ? (n.stretch || 0) * s / 2 : 0);
    n.subBoxes = n.subs.map((sb, j) => ({
      x: n.x, y: firstTop + j * (A.sub * s + gapS) + (A.sub * s) / 2, w: n.w - n.w * 0.08, h: A.sub * s,
      look: "proc", label: o.num && k > 1 ? `(${j + 1})${sb.text}` : sb.text, line: sb.line, x0,
    }));
  }

  // 照査・打合せの点（本線の矢印の上）と箱の高さ
  const nodeOf = i => g.nodes[g.entry[i]];
  for (const grp of groups) {
    const n = nodeOf(grp.unit);
    let dot;
    if (hasSubs(n) && grp.pos === 0) dot = { x: n.x + (grp.left ? -1 : 1) * n.w / 2, y: n.head.y, onEdge: true, owner: n.idx };
    else if (hasSubs(n) && grp.pos < n.subs.length) {
      const a = n.subBoxes[grp.pos - 1], b = n.subBoxes[grp.pos];
      dot = { x: n.x, y: (bottomOf(a) + topOf(b)) / 2, owner: n.idx };
    } else {
      const next = grp.unit + 1 < g.M ? nodeOf(grp.unit + 1) : null;
      const b = g.nodes[g.exit[grp.unit]];
      dot = next ? { x: b.x, y: (bottomOf(b) + topOf(next)) / 2 } : { x: b.x, y: bottomOf(b) + (A.gap / 2) * s };
      dot.owner = b.idx;   // PowerPoint では、この箱と点・照査打合せを 1 つにまとめる
    }
    grp.dot = dot;
  }
  groups.sort((a, b) => a.dot.y - b.dot.y);
  const floors = { true: -Infinity, false: -Infinity };   // 左右の列ごとに、上から重ならないように並べる
  for (const grp of groups) {
    const k = grp.items.length, tot = k * noteH + (k - 1) * A.noteGap * s;
    let t = Math.max(grp.dot.y - tot / 2, floors[grp.left] + 3);
    floors[grp.left] = t + tot;
    // 点を動かすと、箱も一緒についていく（箱だけ動かすこともできる）
    placeDot(grp.dot, grp.uid);
    const ddx = grp.dot.x - grp.dot.x0, ddy = grp.dot.y - grp.dot.y0;
    grp.items.forEach((it, j) => { it.x = (grp.left ? noteXL : noteX) + ddx; it.y = t + j * (noteH + A.noteGap * s) + noteH / 2 + ddy; });
    grp.items.forEach(applyOffset);
    L.dots.push(grp.dot);
    for (const it of grp.items) {
      L.notes.push(it);
      // 点から見て箱のある側のふちにつなぐ（ドラッグで反対側に動かしている間も）
      const toLeft = it.x < grp.dot.x;
      const S = [grp.dot.x, grp.dot.y], E = [it.x + (toLeft ? 1 : -1) * it.w / 2, it.y];
      const ln = Math.abs(S[1] - E[1]) < 0.5 ? { route: "straight" } : { route: "h3", mx: E[0] + (toLeft ? 1 : -1) * noteW * 0.35 };
      L.lines.push(Object.assign(ln, { S, E, type: "note", a: -1, b: it, dot: grp.dot, dashed: true, arrow: false }));
    }
  }

  // 照査①・打合せ①… も、位置の上から順に付け直す（ほかの名前の枝分かれには番号を付けない）
  if (o.num) {
    const k = {};
    for (const it of byPosition(L.notes)) {
      if (!NUMBERED_NOTE_RE.test(it.text)) continue;
      k[it.text] = (k[it.text] || 0) + 1;
      it.label = it.text + CIRCLED(k[it.text]);
    }
  }

  // 文字の大きさ
  const base = Math.max(7, Math.min(16, A.box * s * 0.4));
  fitGroup(g.nodes.filter(n => isShape(n) && !hasSubs(n)).concat(g.nodes.filter(hasSubs).map(n => n.head)), base, L.fam);
  fitGroup(g.nodes.filter(hasSubs).flatMap(n => n.subBoxes), base * 0.92, L.fam);
  fitGroup(L.notes, base * 0.95, L.fam);
  for (const n of g.nodes.filter(hasSubs)) { n.fs = n.head.fs; n.wrapped = n.head.wrapped; }

  // 矢印の通り道。route: straight / v3=縦→横→縦 / h3=横→縦→横 / j4=右→縦→左→下 / h2=横→縦 / v2=縦→横
  const gapAbove = b => topOf(b) - s * 0.09;
  const shapesRight = Math.max(...g.nodes.map(n => (isShape(n) ? n.x + n.w / 2 : n.x2)), ...L.notes.map(n => n.x + n.w / 2));
  const laneX = shapesRight + 12;
  let laneNo = 0;
  const pts = ln => ln.route === "straight" ? [ln.S, ln.E]
    : ln.route === "v3" ? [ln.S, [ln.S[0], ln.my], [ln.E[0], ln.my], ln.E]
    : ln.route === "h3" ? [ln.S, [ln.mx, ln.S[1]], [ln.mx, ln.E[1]], ln.E]
    : ln.route === "h2" ? [ln.S, [ln.E[0], ln.S[1]], ln.E]
    : ln.route === "v2" ? [ln.S, [ln.S[0], ln.E[1]], ln.E]
    : [ln.S, [ln.lx, ln.S[1]], [ln.lx, ln.gy], [ln.E[0], ln.gy], ln.E];
  const kOf = v => v === -1 || v == null ? "" : typeof v === "number"
    ? (g.nodes[v].key || `bar${g.nodes[v].unit}${g.nodes[v].join ? "j" : "f"}`) : (v.key || "");
  const byKey = {};
  g.nodes.forEach((n, i) => { if (n.key) byKey[n.key] = i; });
  // 2 つの箱が横（縦）に重なっていれば、重なっている所にまっすぐな矢印を通す（箱を少し動かしても折れ曲がらない）
  const overlap = (a1, a2, b1, b2, mid) => {
    const lo = Math.max(a1, b1) + 3, hi = Math.min(a2, b2) - 3;
    return lo <= hi ? Math.min(hi, Math.max(lo, mid)) : null;
  };
  // 線は動かした箱の真ん中についていく（相手の箱のふちの上をすべる）
  const follow = (a, b, va, vb) => (moved(a) && !moved(b) ? va : moved(b) && !moved(a) ? vb : (va + vb) / 2);
  const straightX = (a, b) => (Math.abs(a.x - b.x) < 0.5 ? null : overlap(a.x - a.w / 2, a.x + a.w / 2, b.x - b.w / 2, b.x + b.w / 2, follow(a, b, a.x, b.x)));
  const straightY = (a, b) => (Math.abs(a.y - b.y) < 0.5 ? null : overlap(topOf(a), bottomOf(a), topOf(b), bottomOf(b), follow(a, b, a.y, b.y)));
  // 重ならないほど離れた箱どうしは、中心を結ぶ 1 本のまっすぐな線でつなぐ（折れ曲がらない）
  const clip = (n, tx, ty) => {
    const dx = tx - n.x, dy = ty - n.y, kx = n.w / 2 / Math.max(Math.abs(dx), 1e-9), ky = n.h / 2 / Math.max(Math.abs(dy), 1e-9);
    const k = Math.min(kx, ky);
    return { p: [n.x + dx * k, n.y + dy * k], site: kx < ky ? (dx > 0 ? 3 : 1) : (dy > 0 ? 2 : 0) };
  };
  const direct = (a, b, ln) => {
    const A = clip(a, b.x, b.y), B = clip(b, a.x, a.y);
    return Object.assign(ln, { route: "straight", diag: true, S: A.p, E: B.p, sites: [A.site, B.site] });
  };
  const moved = n => n.nx !== undefined && (Math.abs(n.x - n.nx) > 0.5 || Math.abs(n.y - n.ny) > 0.5);
  // 矢印の行き先・出どころを付け替えたときの通り道（相手の位置で形を決める）
  const routeBetween = (a, b, ln) => {
    // 間に別の箱があるかどうか（あれば右を回る）
    const blocked = g.nodes.some(n => isShape(n) && n !== a && n !== b &&
      Math.abs(n.x - b.x) < n.w / 2 + 2 && topOf(n) < topOf(b) && bottomOf(n) > bottomOf(a));
    if (topOf(b) >= bottomOf(a) - 0.5 && !blocked) {
      const x = straightX(a, b);
      ln.S = [x ?? a.x, bottomOf(a)]; ln.E = [x ?? b.x, topOf(b)]; ln.sites = [2, 0];
      if (Math.abs(ln.S[0] - ln.E[0]) < 0.5) ln.route = "straight"; else direct(a, b, ln);
    } else if (blocked || bottomOf(b) <= topOf(a) + 0.5) {
      ln.S = [a.x + a.w / 2, a.y]; ln.E = [b.x, topOf(b)]; ln.sites = [3, 0];
      ln.route = "j4"; ln.lx = Math.max(a.x + a.w / 2, b.x + b.w / 2) + 16; ln.gy = topOf(b) - s * 0.12;
    } else {
      const right = b.x > a.x;
      const y = straightY(a, b);
      ln.S = [a.x + (right ? 1 : -1) * a.w / 2, y ?? a.y]; ln.E = [b.x - (right ? 1 : -1) * b.w / 2, y ?? b.y]; ln.sites = right ? [3, 1] : [1, 3];
      if (Math.abs(ln.S[1] - ln.E[1]) < 0.5) ln.route = "straight"; else direct(a, b, ln);
    }
  };
  for (const e of g.edges) {
    const key = `～${e.type}|${kOf(e.a)}|${kOf(e.b)}|`;
    const rw = o.rewires[key];
    if (rw) {
      // はしは「箱」か「何もない所の点（伸ばした先）」
      const endOf = (v, def) => typeof v !== "string" ? g.nodes[def]
        : byKey[v] !== undefined ? g.nodes[byKey[v]] : null;
      const A = endOf(rw.a, e.a), B = endOf(rw.b, e.b);
      if (A && B && A !== B) {
        const ln = { type: e.type, a: A.idx, b: B.idx, arrow: true, key, edge: true };
        routeBetween(A, B, ln);
        L.lines.push(ln);
        L.moved++;
        continue;
      }
    }
    const a = g.nodes[e.a], b = g.nodes[e.b];
    let S, E, ln;
    if (e.type === "down" || e.type === "merge") {
      S = [a.kind === "bar" ? b.x : a.x, bottomOf(a)];
      E = [b.kind === "bar" ? a.x : b.x, topOf(b)];
      const x = a.kind !== "bar" && b.kind !== "bar" ? straightX(a, b) : null;
      if (x !== null) { S = [x, S[1]]; E = [x, E[1]]; }
      if (Math.abs(S[0] - E[0]) < 0.5) ln = { route: "straight" };
      else if (a.kind !== "bar" && b.kind !== "bar" && (e.type === "down" || moved(a) || moved(b))) ln = direct(a, b, {});
      else {
        const gy = gapAbove(b);
        ln = { route: "v3", my: e.type === "merge" && gy > S[1] && gy < E[1] ? gy : (S[1] + E[1]) / 2 };
      }
    } else if (e.type === "right") {
      const y = straightY(a, b);
      S = [a.x + a.w / 2, y ?? a.y];
      E = [b.x - b.w / 2, y ?? b.y];
      ln = Math.abs(S[1] - E[1]) < 0.5 ? { route: "straight" } : direct(a, b, {});
    } else {
      S = [a.x + a.w / 2, a.y];
      E = [b.x, topOf(b)];
      ln = { route: "j4", lx: laneX + 12 * laneNo++, gy: gapAbove(b) };
    }
    if (ln.diag) ({ S, E } = ln);
    L.lines.push(Object.assign(ln, { S, E, type: e.type, a: e.a, b: e.b, arrow: true, key, edge: true }));
  }
  // 二重線（同時進行の分かれ目・合流）は、つながる矢印の所まで必ず伸ばす（箱を横に動かしても外れない）
  for (const ln of L.lines) for (const [v, p] of [[ln.a, ln.S], [ln.b, ln.E]]) {
    const n = typeof v === "number" && v >= 0 ? g.nodes[v] : null;
    if (!n || n.kind !== "bar") continue;
    n.x1 = Math.min(n.x1, p[0] - boxW * 0.12);
    n.x2 = Math.max(n.x2, p[0] + boxW * 0.12);
    n.w = n.x2 - n.x1;
  }
  // 小項目どうしの矢印
  for (const n of g.nodes.filter(hasSubs)) {
    for (let j = 0; j < n.subBoxes.length - 1; j++) {
      const a = n.subBoxes[j], b = n.subBoxes[j + 1];
      L.lines.push({ route: "straight", S: [a.x, bottomOf(a)], E: [b.x, topOf(b)], type: "sub", owner: n, a: j, b: j + 1, arrow: true });
    }
  }
  // 左の並行手順：本線の点から破線で分かれ、破線で本線の点に合流
  g.sideLanes.forEach(sl => {
    const first = g.nodes[sl.ids[0]], last = g.nodes[sl.ids[sl.ids.length - 1]];
    const P = nodeOf(sl.from);
    const d1 = placeDot({ x: P.x, y: topOf(P) - (A.gap / 2) * s, owner: P.idx }, `<${first.uid}`);
    L.dots.push(d1);
    L.lines.push({ route: "h2", S: [d1.x, d1.y], E: [first.x, topOf(first)], type: "branch", a: -1, b: first.idx, dot: d1, dashed: true, arrow: false });
    if (sl.to >= 0 && !last.isEnd) {
      const T = nodeOf(sl.to);
      const d2 = placeDot({ x: T.x, y: topOf(T) - (A.gap / 2) * s, owner: T.idx }, `>${last.uid}`);
      L.dots.push(d2);
      L.lines.push({ route: "v2", S: [last.x, bottomOf(last)], E: [d2.x, d2.y], type: "rejoin", a: last.idx, b: -1, dot: d2, dashed: true, arrow: false });
    }
  });
  // 線の曲がる位置もドラッグで動かせる（縦→横→縦は上下、横→縦→横は左右、戻りの線は両方）
  for (const ln of L.lines) {
    if ((ln.route === "h2" || ln.route === "v2") && (Math.abs(ln.S[0] - ln.E[0]) < 0.5 || Math.abs(ln.S[1] - ln.E[1]) < 0.5)) ln.route = "straight";
    if (ln.type !== "sub" && !ln.key) ln.key = `～${ln.type}|${kOf(ln.a)}|${kOf(ln.b)}|${ln.dot ? ln.dot.key : ""}`;
    const off = ln.key && o.offsets[ln.key];
    if (off && ["v3", "h3", "j4"].includes(ln.route)) {
      if (ln.route === "v3") ln.my += off[1];
      else if (ln.route === "h3") ln.mx += off[0];
      else { ln.lx += off[0]; ln.gy += off[1]; }
      L.moved++;
    } else if (off && ln.route === "straight" && ln.edge && !ln.diag) {
      // まっすぐな矢印は、傾かないようにそのまま横（横向きの矢印は縦）にずらす。
      // はしは両方の箱のふちの上に残す（はみ出す分は箱の中に収める）
      const vert = Math.abs(ln.S[0] - ln.E[0]) < 0.5;
      const span = v => {
        if (v < 0) return null;
        const n = g.nodes[v];
        if (n.kind === "bar") return vert ? [n.x1, n.x2] : [topOf(n), bottomOf(n)];
        return vert ? [n.x - n.w / 2, n.x + n.w / 2] : [topOf(n), bottomOf(n)];
      };
      const ra = span(ln.a), rb = span(ln.b);
      let lo = -Infinity, hi = Infinity;
      for (const r of [ra, rb]) if (r) { lo = Math.max(lo, r[0] + 2); hi = Math.min(hi, r[1] - 2); }
      const base = vert ? ln.S[0] : ln.S[1];
      const to = lo <= hi ? Math.min(hi, Math.max(lo, base + (vert ? off[0] : off[1]))) : base;
      if (Math.abs(to - base) > 0.1) {
        if (vert) { ln.S = [to, ln.S[1]]; ln.E = [to, ln.E[1]]; } else { ln.S = [ln.S[0], to]; ln.E = [ln.E[0], to]; }
        ln.shifted = true;
        L.moved++;
      }
    }
    const ls = ln.key && o.lineStyles[ln.key];
    if (ls === "none") ln.hidden = true;
    else if (ls) ln.dashed = ls === "dashed";
    ln.pts = pts(ln);
  }
  // 消した線は描かない（「消した線を戻す」で戻せる）
  L.hiddenLines = L.lines.filter(l => l.hidden).length;
  L.lines = L.lines.filter(l => !l.hidden);
  L.dotR = Math.max(1.8, s * 0.07);
  // 点を吸い付かせる先：実線の矢印と、図形のふち
  L.snap = [];
  for (const ln of L.lines) if (!ln.dashed) for (let k = 0; k < ln.pts.length - 1; k++) L.snap.push([ln.pts[k], ln.pts[k + 1]]);
  const arrowSegs = L.snap.slice();   // 矢印だけ（点は、見出しの横に付くもの以外は矢印の上に置く）
  const edges = t => { const x1 = t.x - t.w / 2, x2 = t.x + t.w / 2, y1 = topOf(t), y2 = bottomOf(t); return [[[x1, y1], [x2, y1]], [[x2, y1], [x2, y2]], [[x2, y2], [x1, y2]], [[x1, y2], [x1, y1]]]; };
  for (const n of g.nodes) {
    if (!isShape(n)) continue;
    L.snap.push(...edges(n));
    if (hasSubs(n)) { L.snap.push(...edges(n.head)); n.subBoxes.forEach(b => L.snap.push(...edges(b))); }
  }
  // 黒い点は、必ず実線の矢印か箱のふちの上に置く（箱や点を動かしても線から離れない）
  for (const d of L.dots) {
    // 同じ高さを通る矢印の上に置く。なければ、その点が付いている箱のふちの上（箱の中の矢印に吸い込まれない）
    let q;
    if (d.onEdge) q = nearestOn([d.x, d.y], L.snap);
    else {
      const cross = arrowSegs.filter(([a, b]) => Math.min(a[1], b[1]) - 0.5 <= d.y && d.y <= Math.max(a[1], b[1]) + 0.5);
      const own = d.owner !== undefined && g.nodes[d.owner] && isShape(g.nodes[d.owner]) ? edges(g.nodes[d.owner]) : L.snap;
      q = cross.length ? nearestOn([d.x, d.y], cross) : nearestOn([d.x, d.y], own);
    }
    if (!q || Math.hypot(q[0] - d.x, q[1] - d.y) < 0.05) continue;
    d.x = q[0]; d.y = q[1];
    for (const ln of L.lines) {
      if (ln.dot !== d) continue;
      if (ln.type === "rejoin") { ln.E = [d.x, d.y]; ln.route = "v2"; }
      else if (ln.type === "branch") { ln.S = [d.x, d.y]; ln.route = "h2"; }
      else {
        ln.S = [d.x, d.y];
        if (Math.abs(ln.S[1] - ln.E[1]) < 0.5) ln.route = "straight";
        else if (ln.route === "straight") { ln.route = "h3"; ln.mx = ln.E[0] - noteW * 0.35; }
      }
      ln.pts = pts(ln);
    }
  }
  return L;
}

function svgOf(L, st, forImage) {

  out.push(`<rect width="${L.W}" height="${L.H}" fill="#FFFFFF"/>`);

  if (!L.nodes.length && !forImage) {

  }
