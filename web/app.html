  const cursorOf = ln => WIRE_CURSOR[ln.route] || (ln.edge ? (Math.abs(ln.S[0] - ln.E[0]) < 0.5 ? "ew-resize" : "ns-resize") : "pointer");
  L.lines.forEach((ln, i) => {
    if (ln.type === "sub") return;
    const d = `M${ln.pts.map(p => f1(p[0]) + "," + f1(p[1])).join(" L")}`;
    out.push(`<path d="${d}" fill="none" stroke="${c(st.arrow)}" stroke-width="${ln.dashed ? Math.max(0.75, st.lineW * 0.75) : st.lineW}"${ln.dashed ? ' stroke-dasharray="4 3"' : ""}${ln.arrow ? ' marker-end="url(#ah)"' : ""}/>`);
    if (forImage) return;
    // 選んでいる線は色を付けて目立たせる
    if (ln.key && ln.key === selWire) out.push(`<path d="${d}" fill="none" stroke="#E0752D" stroke-opacity=".45" stroke-width="5" pointer-events="none"/>`);
    // つかみやすいように、見えない太い線を重ねる（クリックで線の種類、曲がった線はドラッグで移動）
    out.push(`<path class="wire" data-w="${i}" d="${d}" fill="none" stroke="#1D6A84" stroke-opacity="0" stroke-width="9" style="cursor:${cursorOf(ln)}"/>`);
  });
  L.nodes.forEach((n, i) => {
    if (n.kind === "bar") {
      out.push(`<path d="M${f1(n.x1)},${f1(topOf(n))} H${f1(n.x2)} M${f1(n.x1)},${f1(bottomOf(n))} H${f1(n.x2)}" stroke="${c(st.arrow)}" stroke-width="${st.lineW}" fill="none"/>`);
      return;
    }
    out.push(`<g class="node" data-i="${i}" data-line="${n.line}">`);
    if (hasSubs(n)) {
      out.push(svgRect(n, st.body, st.proc[1], st.lineW, "shape"));
      out.push(svgRect(n.head, st.head, st.proc[1], st.lineW));
      out.push(svgText(n.head, st.text, "c"));
      for (const ln of L.lines) if (ln.type === "sub" && ln.owner === n) {
        out.push(`<path d="M${f1(ln.S[0])},${f1(ln.S[1])} L${f1(ln.E[0])},${f1(ln.E[1])}" stroke="${c(st.arrow)}" stroke-width="${st.lineW}" marker-end="url(#ah)"/>`);
      }
      n.subBoxes.forEach((b, j) => {
        out.push(`<g class="sub" data-sub="${j}" data-line="${b.line}">${svgRect(b, st.sub[0], st.sub[1], st.lineW)}${svgText(b, st.text, "l")}</g>`);
      });
    } else {
      const [fill, line] = st[n.look];
      const x = n.x - n.w / 2, y = topOf(n);
      if (n.look === "dec") out.push(`<path class="shape" d="M${f1(n.x)},${f1(y)} L${f1(x + n.w)},${f1(n.y)} L${f1(n.x)},${f1(y + n.h)} L${f1(x)},${f1(n.y)} Z" fill="${c(fill)}" stroke="${c(line)}" stroke-width="${st.lineW}"/>`);
      else out.push(`<rect class="shape" x="${f1(x)}" y="${f1(y)}" width="${f1(n.w)}" height="${f1(n.h)}"${n.look === "term" ? ` rx="${f1(n.h / 2)}"` : ""} fill="${c(fill)}" stroke="${c(line)}" stroke-width="${st.lineW}"/>`);
      out.push(svgText(n, st.text, "c"));
    }
    out.push(`</g>`);
  });
  L.notes.forEach((n, j) => {
    out.push(`<g class="node" data-note="${j}" data-line="${n.line}">${svgRect(n, st.notes[n.cat], st.proc[1], st.lineW, "shape")}${svgText(n, st.text, "c")}</g>`);
  });
  // 矢印の両はし（ドラッグして別の箱に付け替える）
  if (!forImage) L.lines.forEach((ln, i) => {
    if (!ln.edge) return;
    for (const [end, p] of [["a", ln.S], ["b", ln.E]]) {
      if (ln[end] >= 0 && L.nodes[ln[end]].kind === "bar") continue;
      // 伸ばして何にもつながっていないはしは、うっすら見せておく
      const free = ln[end] < 0;
      out.push(`<circle class="end" data-w="${i}" data-end="${end}" cx="${f1(p[0])}" cy="${f1(p[1])}" r="5" fill="#E0752D" fill-opacity="${free ? 0.3 : 0}"/>`);
    }
  });
  // 箱を動かしている間の補助線
  if (!forImage && dragGuides) {
    if (dragGuides.x !== null) out.push(`<line x1="${f1(dragGuides.x)}" y1="0" x2="${f1(dragGuides.x)}" y2="${L.H}" stroke="#1D6A84" stroke-width="0.8" stroke-dasharray="3 3" pointer-events="none"/>`);
    if (dragGuides.y !== null) out.push(`<line x1="0" y1="${f1(dragGuides.y)}" x2="${L.W}" y2="${f1(dragGuides.y)}" stroke="#1D6A84" stroke-width="0.8" stroke-dasharray="3 3" pointer-events="none"/>`);
  }
  L.dots.forEach((d, i) => out.push(`<g class="dot" data-dot="${i}"><circle cx="${f1(d.x)}" cy="${f1(d.y)}" r="${f1(Math.max(7, L.dotR * 2.5))}" fill="#000000" fill-opacity="0"/><circle cx="${f1(d.x)}" cy="${f1(d.y)}" r="${f1(L.dotR)}" fill="${c(st.arrow)}"/></g>`));
  out.push(`</svg>`);
  return out.join("");
}

// ---------- PowerPoint（.pptx） ----------
const EMU = v => Math.round(v * 12700);
function runXml(text, fs, color, font) {
  return `<a:r><a:rPr lang="ja-JP" altLang="en-US" sz="${Math.round(fs * 100)}" dirty="0"><a:solidFill><a:srgbClr val="${color}"/></a:solidFill><a:latin typeface="${esc(font)}"/><a:ea typeface="${esc(font)}"/></a:rPr><a:t>${esc(text)}</a:t></a:r>`;
}
function slideXml(L, st, font) {
  let id = 2;
  const out = [];
  const xfrm = (x, y, w, h, attrs = "") =>
    `<a:xfrm${attrs}><a:off x="${EMU(x)}" y="${EMU(y)}"/><a:ext cx="${Math.max(0, EMU(w))}" cy="${Math.max(0, EMU(h))}"/></a:xfrm>`;
  const lnXml = (color, w, arrow, dashed) =>
    `<a:ln w="${EMU(w)}"><a:solidFill><a:srgbClr val="${color}"/></a:solidFill>${dashed ? '<a:prstDash val="dash"/>' : ""}${arrow ? '<a:tailEnd type="triangle" w="med" len="med"/>' : ""}</a:ln>`;
  const flips = (h, v, rot) => `${rot ? ` rot="${rot}"` : ""}${h ? ' flipH="1"' : ""}${v ? ' flipV="1"' : ""}`;
  const geom = { proc: "flowChartProcess", dec: "flowChartDecision", term: "flowChartTerminator" };
  const kindName = { proc: "処理", dec: "判断", term: "端子" };

  // 文字の入った図形（t は x, y, w, h, look, label, fs）
  const shapeXml = (t, name, prst, fill, line, align = "ctr") => {
    const ins = EMU(textBox(t).ins);
    const body = t.label === undefined ? "" :
      `<p:txBody><a:bodyPr wrap="square" lIns="${ins}" tIns="0" rIns="${ins}" bIns="0" rtlCol="0" anchor="ctr"><a:noAutofit/></a:bodyPr><a:lstStyle/>` +
      `<a:p><a:pPr algn="${align}"><a:lnSpc><a:spcPts val="${Math.round(t.fs * LH * 100)}"/></a:lnSpc></a:pPr>${runXml(t.label, t.fs, st.text, font)}</a:p></p:txBody>`;
    return `<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="${name} ${id++}"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr>` +
      `<p:spPr>${xfrm(t.x - t.w / 2, topOf(t), t.w, t.h)}<a:prstGeom prst="${prst}"><a:avLst/></a:prstGeom>` +
      `<a:solidFill><a:srgbClr val="${fill}"/></a:solidFill>${lnXml(line, st.lineW, false, false)}</p:spPr>${body}</p:sp>`;
  };

  // 矢印はすべて図形にくっつくコネクタ（接続点 0=上 1=左 2=下 3=右）
  const adj = (name, v) => `<a:gd name="${name}" fmla="val ${Math.round(v * 100000)}"/>`;
  const connXml = (ln, start, end) => {
    const [sx, sy] = ln.S, [ex, ey] = ln.E;
    const W = Math.max(Math.abs(ex - sx), 0.01), H = Math.max(Math.abs(ey - sy), 0.01);
    const x0 = Math.min(sx, ex), y0 = Math.min(sy, ey);
    const down = ey > sy, leftward = ex < sx;
    const cx = (sx + ex) / 2, cy = (sy + ey) / 2;
    let prst, xf, av = "";
    if (ln.route === "straight") { prst = "straightConnector1"; xf = xfrm(x0, y0, Math.abs(ex - sx), Math.abs(ey - sy), flips(leftward, !down && ey !== sy)); }
    else if (ln.route === "h3") { prst = "bentConnector3"; xf = xfrm(x0, y0, W, H, flips(leftward, !down)); av = adj("adj1", Math.abs(ln.mx - sx) / W); }
    else if (ln.route === "h2") { prst = "bentConnector2"; xf = xfrm(x0, y0, W, H, flips(leftward, !down)); }
    else if (ln.route === "j4") {
      prst = "bentConnector4"; xf = xfrm(x0, y0, W, H, flips(leftward, !down));
      av = adj("adj1", (leftward ? sx - ln.lx : ln.lx - sx) / W) + adj("adj2", (!down ? sy - ln.gy : ln.gy - sy) / H);
    } else {
      // 縦から始まる形は、横から始まる形を 90° 回して作る
      prst = ln.route === "v2" ? "bentConnector2" : "bentConnector3";
      xf = xfrm(cx - H / 2, cy - W / 2, H, W, flips(!down, !leftward, 5400000));
      if (ln.route === "v3") av = adj("adj1", Math.abs(ln.my - sy) / H);
    }
    return `<p:cxnSp><p:nvCxnSpPr><p:cNvPr id="${id}" name="矢印 ${id++}"/><p:cNvCxnSpPr>` +
      `${start ? `<a:stCxn id="${start[0]}" idx="${start[1]}"/>` : ""}${end ? `<a:endCxn id="${end[0]}" idx="${end[1]}"/>` : ""}</p:cNvCxnSpPr><p:nvPr/></p:nvCxnSpPr>` +
      `<p:spPr>${xf}<a:prstGeom prst="${prst}"><a:avLst>${av}</a:avLst></a:prstGeom>` +
      `<a:noFill/>${lnXml(st.arrow, ln.dashed ? Math.max(0.75, st.lineW * 0.75) : st.lineW, ln.arrow, ln.dashed)}</p:spPr></p:cxnSp>`;
  };

  const ids = [], dotIds = [], noteIds = [];
  const barSites = new Map();   // 「線の番号|はし」→ [二重線の見えない箱の id, 接続点]
  const dotXml = (d, di) => {
    const r = L.dotR;
    dotIds[di] = id;
    return `<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="点 ${id++}"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr><p:spPr>${xfrm(d.x - r, d.y - r, r * 2, r * 2)}` +
      `<a:prstGeom prst="ellipse"><a:avLst/></a:prstGeom><a:solidFill><a:srgbClr val="${st.arrow}"/></a:solidFill><a:ln><a:noFill/></a:ln></p:spPr></p:sp>`;
  };
  const noteXml = (nt, ni) => { noteIds[ni] = id; return shapeXml(nt, "照査・打合せ", "rect", st.notes[nt.cat], st.proc[1]); };
  const dotOf = ln => [dotIds[L.dots.indexOf(ln.dot)], 0];
  const noteLineXml = ln => connXml(ln, dotOf(ln), [noteIds[L.notes.indexOf(ln.b)], ln.E[0] > ln.b.x ? 3 : 1]);
  const done = new Set();   // もう書いた点・線

  // 箱ごとに、その箱に付いている点と照査・打合せ（と破線）を集める
  const own = {};
  L.dots.forEach((d, di) => {
    if (d.owner !== undefined && L.nodes[d.owner] && isShape(L.nodes[d.owner])) (own[d.owner] = own[d.owner] || []).push(di);
  });

  L.nodes.forEach((n, i) => {
    if (n.kind === "bar") {
      const W = n.x2 - n.x1;
      // 矢印がつく所ごとに、見えない小さな箱を置いて二重線と 1 つにまとめる。
      // 矢印はこの箱にくっつけるので、PowerPoint で二重線や箱を動かしても外れない
      const sites = [];
      L.lines.forEach((ln, li) => {
        for (const [v, p, end] of [[ln.a, ln.S, "a"], [ln.b, ln.E, "b"]]) {
          if (v === i) sites.push({ key: `${li}|${end}`, x: p[0], top: Math.abs(p[1] - topOf(n)) <= Math.abs(p[1] - bottomOf(n)) });
        }
      });
      const gid = id++;
      const bar = `<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="${n.join ? "合流" : "同時進行"} ${id++}"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr><p:spPr>${xfrm(n.x1, topOf(n), W, n.h)}` +
        `<a:custGeom><a:avLst/><a:gdLst/><a:ahLst/><a:cxnLst/><a:rect l="0" t="0" r="r" b="b"/><a:pathLst><a:path w="${Math.max(1, EMU(W))}" h="${Math.max(1, EMU(n.h))}" fill="none">` +
        `<a:moveTo><a:pt x="0" y="0"/></a:moveTo><a:lnTo><a:pt x="${EMU(W)}" y="0"/></a:lnTo><a:moveTo><a:pt x="0" y="${EMU(n.h)}"/></a:moveTo><a:lnTo><a:pt x="${EMU(W)}" y="${EMU(n.h)}"/></a:lnTo>` +
        `</a:path></a:pathLst></a:custGeom><a:noFill/>${lnXml(st.arrow, st.lineW, false, false)}</p:spPr></p:sp>`;
      const pins = sites.map(q => {
        barSites.set(q.key, [id, q.top ? 0 : 2]);
        return `<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="接続点 ${id++}"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr><p:spPr>${xfrm(q.x - 0.5, q.top ? topOf(n) : bottomOf(n), 1, 0)}` +
          `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/><a:ln><a:noFill/></a:ln></p:spPr></p:sp>`;
      });
      const off = `<a:off x="${EMU(n.x1)}" y="${EMU(topOf(n))}"/><a:ext cx="${EMU(W)}" cy="${EMU(n.h)}"/>`;
      out.push(`<p:grpSp><p:nvGrpSpPr><p:cNvPr id="${gid}" name="${n.join ? "合流" : "同時進行"}（二重線）"/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>` +
        `<p:grpSpPr><a:xfrm>${off}${off.replace("a:off", "a:chOff").replace("a:ext", "a:chExt")}</a:xfrm></p:grpSpPr>${bar}${pins.join("")}</p:grpSp>`);
      return;
    }
    let xml;
    if (!hasSubs(n)) {
      ids[i] = id;
      const [fill, line] = st[n.look];
      xml = shapeXml(n, kindName[n.kind], geom[n.look], fill, line);
    } else {
      // 小項目つき：外枠・見出し・小項目・中の矢印を 1 つのグループにする（まとめて動く）
      const gid = id++;
      ids[i] = id;
      const parts = [shapeXml(Object.assign({}, n, { label: undefined }), "外枠", "rect", st.body, st.proc[1])];
      parts.push(shapeXml(n.head, "見出し", "rect", st.head, st.proc[1]));
      const subIds = n.subBoxes.map(b => { const sid = id; parts.push(shapeXml(b, "小項目", "rect", st.sub[0], st.sub[1], "l")); return sid; });
      for (const ln of L.lines) if (ln.type === "sub" && ln.owner === n) parts.push(connXml(ln, [subIds[ln.a], 2], [subIds[ln.b], 0]));
      const off = `<a:off x="${EMU(n.x - n.w / 2)}" y="${EMU(topOf(n))}"/><a:ext cx="${EMU(n.w)}" cy="${EMU(n.h)}"/>`;
      xml = `<p:grpSp><p:nvGrpSpPr><p:cNvPr id="${gid}" name="${esc(n.label)}"/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>` +
        `<p:grpSpPr><a:xfrm>${off}${off.replace("a:off", "a:chOff").replace("a:ext", "a:chExt")}</a:xfrm></p:grpSpPr>${parts.join("")}</p:grpSp>`;
    }
    if (!own[i]) { out.push(xml); return; }

    // 箱と、その箱に付いている点・照査打合せを 1 つにまとめる（PowerPoint で箱を動かすと一緒に動く）
    const parts = [xml];
    let x1 = n.x - n.w / 2, y1 = topOf(n), x2 = n.x + n.w / 2, y2 = bottomOf(n);
    const grow = (ax, ay, bx, by) => { x1 = Math.min(x1, ax); y1 = Math.min(y1, ay); x2 = Math.max(x2, bx); y2 = Math.max(y2, by); };
    for (const di of own[i]) {
      const d = L.dots[di], r = L.dotR;
      parts.push(dotXml(d, di));
      grow(d.x - r, d.y - r, d.x + r, d.y + r);
      const nls = L.lines.filter(l => l.type === "note" && l.dot === d);
      for (const l of nls) {
        const nt = l.b, ni = L.notes.indexOf(nt);
        if (noteIds[ni] === undefined) { parts.push(noteXml(nt, ni)); grow(nt.x - nt.w / 2, topOf(nt), nt.x + nt.w / 2, bottomOf(nt)); }
      }
      for (const l of nls) {
        parts.push(noteLineXml(l));
        done.add(l);
        for (const q of l.pts) grow(q[0], q[1], q[0], q[1]);
      }
    }
    const gid = id++;
    const off = `<a:off x="${EMU(x1)}" y="${EMU(y1)}"/><a:ext cx="${EMU(x2 - x1)}" cy="${EMU(y2 - y1)}"/>`;
    out.push(`<p:grpSp><p:nvGrpSpPr><p:cNvPr id="${gid}" name="${esc(n.label)}（照査・打合せ付き）"/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>` +
      `<p:grpSpPr><a:xfrm>${off}${off.replace("a:off", "a:chOff").replace("a:ext", "a:chExt")}</a:xfrm></p:grpSpPr>${parts.join("")}</p:grpSp>`);
  });
  // どの箱にも付いていない点・照査打合せ
  L.dots.forEach((d, di) => { if (dotIds[di] === undefined) out.push(dotXml(d, di)); });
  L.notes.forEach((nt, ni) => { if (noteIds[ni] === undefined) out.push(noteXml(nt, ni)); });

  const SITES = { down: [2, 0], merge: [2, 0], right: [3, 1], jump: [3, 0] };
  for (const ln of L.lines) {
    if (ln.type === "sub" || done.has(ln)) continue;
    if (ln.type === "note") { out.push(noteLineXml(ln)); continue; }
    if (ln.type === "branch") { out.push(connXml(ln, dotOf(ln), [ids[ln.b], 0])); continue; }
    if (ln.type === "rejoin") { out.push(connXml(ln, [ids[ln.a], 2], dotOf(ln))); continue; }
    const [sa, sb] = ln.sites || SITES[ln.type];
    const li = L.lines.indexOf(ln);
    const glue = (v, site, end) => (v < 0 ? null
      : L.nodes[v].kind === "bar" ? barSites.get(`${li}|${end}`) || null
      : [ids[v], site]);
    // 横にずらした矢印も箱や二重線にくっつけておく（PowerPoint で動かしても置いていかれない）
    out.push(connXml(ln, glue(ln.a, sa, "a"), glue(ln.b, sb, "b")));
  }
  if (L.title) {
    const t = L.title;
    out.push(`<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="タイトル ${id++}"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr><p:spPr>${xfrm(t.x, t.y, L.W - t.x * 2, t.fs * 1.6)}<a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr>` +
      `<p:txBody><a:bodyPr wrap="square" lIns="0" tIns="0" rIns="0" bIns="0" rtlCol="0" anchor="t"><a:noAutofit/></a:bodyPr><a:lstStyle/>` +
      `<a:p><a:pPr algn="l"/>${runXml(t.text, t.fs, st.text, font).replace("<a:rPr ", '<a:rPr b="1" ')}</a:p></p:txBody></p:sp>`);
  }

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">` +
    `<p:cSld><p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>` +
    `<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>` +
    `${out.join("")}</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>`;
}

function pptxParts(L, st, font) {
  const parts = Object.assign({}, TEMPLATE);
  const cx = EMU(L.W), cy = EMU(L.H), kx = cx / 9144000, ky = cy / 6858000;
  parts["ppt/presentation.xml"] = parts["ppt/presentation.xml"].replace(/<p:sldSz[^>]*\/>/, `<p:sldSz cx="${cx}" cy="${cy}"/>`);
  for (const k of Object.keys(parts)) {
    if (!/^ppt\/(slideMasters|slideLayouts)\/[^/]+\.xml$/.test(k)) continue;
    parts[k] = parts[k].replace(/<a:off x="(-?\d+)" y="(-?\d+)"\/><a:ext cx="(\d+)" cy="(\d+)"\/>/g,
      (m, x, y, w, h) => `<a:off x="${Math.round(x * kx)}" y="${Math.round(y * ky)}"/><a:ext cx="${Math.round(w * kx)}" cy="${Math.round(h * ky)}"/>`);
  }
  parts["ppt/slides/slide1.xml"] = slideXml(L, st, font);
  parts["ppt/slides/_rels/slide1.xml.rels"] = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout7.xml"/></Relationships>`;
  return parts;
}

// ---------- ZIP（無圧縮） ----------
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipBytes(files) {
  const enc = new TextEncoder(), chunks = [], central = [];
  let offset = 0;
  const names = Object.keys(files).sort((a, b) => (a === "[Content_Types].xml" ? -1 : b === "[Content_Types].xml" ? 1 : 0));
  for (const name of names) {
    const data = enc.encode(files[name]), nb = enc.encode(name), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, 0, true); h.setUint16(12, 33, true); h.setUint32(14, crc, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nb.length, true); h.setUint16(28, 0, true);
    chunks.push(new Uint8Array(h.buffer), nb, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(10, 0, true); c.setUint16(12, 0, true); c.setUint16(14, 33, true); c.setUint32(16, crc, true);
    c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nb.length, true);
    c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), nb);
    offset += 30 + nb.length + data.length;
  }
  const cdSize = central.reduce((s, a) => s + a.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, names.length, true); e.setUint16(10, names.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
  const all = chunks.concat(central, [new Uint8Array(e.buffer)]);
  const out = new Uint8Array(all.reduce((s, a) => s + a.length, 0));
  let p = 0; for (const a of all) { out.set(a, p); p += a.length; }
  return out;
}

// ---------- 画面 ----------
const $ = id => document.getElementById(id);
const ta = $("src"), gutter = $("gutter"), paper = $("paper"), msgsEl = $("msgs");
const optIds = ["optSize", "optStyle", "optFont", "optTitle"];
let state = null;
let offsets = {};   // ドラッグで動かした量（図形ごと、pt）
let rewires = {};   // 付け替えた矢印（矢印ごと、はし → 箱）
let lineStyles = {};   // 線ごとの実線・点線
let selWire = null;    // 選んでいる線

function options() {
  return {
    size: $("optSize").value, style: $("optStyle").value, font: $("optFont").value,
    shape: "same", num: true, title: clean($("optTitle").value), offsets, rewires, lineStyles,
  };
}

// ---------- 行の見分け ----------
// 各行に見えない番号を付けて、書き換え・行の追加や削除のあとも同じ行として追いかける
let lineIds = [], prevLines = [];
const newId = () => Math.random().toString(36).slice(2, 9);
function syncIds() {
  const N = ta.value.replace(/\r\n?/g, "\n").split("\n"), O = prevLines;
  if (O.length !== lineIds.length) { lineIds = N.map(newId); prevLines = N; return; }
  let p = 0;
  while (p < O.length && p < N.length && O[p] === N[p]) p++;
  let q = 0;
  while (q < O.length - p && q < N.length - p && O[O.length - 1 - q] === N[N.length - 1 - q]) q++;
  const oldMid = lineIds.slice(p, O.length - q), mid = [];
  for (let k = 0; k < N.length - q - p; k++) mid.push(k < oldMid.length ? oldMid[k] : newId());
  lineIds = lineIds.slice(0, p).concat(mid, lineIds.slice(O.length - q));
  prevLines = N;
}

// 「> #4」の行き先は、番号ではなく「どの行の手順か」で覚えておく。
// 箱を足す・消す・並べ替えるで手順の番号がずれたら、文の「#番号」を付け直す（書き換え中の行はそのまま）
const REF_RE = /([>＞]\s*)([#＃])\s*([0-9０-９]+)/g;
let jumpRefs = null;   // 行の見えない番号 → { text: その行の文, to: [行き先の手順の見えない番号…] }
let fixingRefs = false;
function rememberJumps(units) {
  jumpRefs = {};
  ta.value.replace(/\r\n?/g, "\n").split("\n").forEach((ln, i) => {
    const to = [...ln.matchAll(REF_RE)].map(m => { const u = units[parseInt(toHalf(m[3]), 10) - 1]; return u ? u.uid : null; });
    if (to.length) jumpRefs[lineIds[i]] = { text: ln, to };
  });
}
function renumberJumps(num) {
  if (!jumpRefs) return 0;
  const lines = ta.value.replace(/\r\n?/g, "\n").split("\n");
  const numOf = {};
  parse(ta.value, num, lineIds).units.forEach((u, i) => { numOf[u.uid] = i + 1; });
  const edits = [];
  let start = 0;
  lines.forEach((ln, i) => {
    const ref = jumpRefs[lineIds[i]];
    if (ref && ref.text === ln) {
      let k = 0;
      const next = ln.replace(REF_RE, (m, pre, hash, n) => {
        const to = numOf[ref.to[k++]];
        return to && to !== parseInt(toHalf(n), 10) ? `${pre}${hash}${to}` : m;
      });
      if (next !== ln) edits.push([start, start + ln.length, next]);
    }
    start += ln.length + 1;
  });
  if (!edits.length) return 0;
  applyEdits(edits);
  return edits.length;
}
// [はじめ, おわり, 新しい文] の書き換えを、下から順に行う（Ctrl+Z で戻せる方法で。カーソルの位置はずらさない）
function applyEdits(edits) {
  const focused = document.activeElement === ta;
  let a = ta.selectionStart, b = ta.selectionEnd;
  const shift = p => edits.reduce((q, [s, e, t]) => (e <= p ? q + t.length - (e - s) : q), p);
  fixingRefs = true;
  try {
    if (focused) for (const [s, e, t] of edits.slice().reverse()) typeAt(s, e, t);
    else {
      let v = ta.value;
      for (const [s, e, t] of edits.slice().reverse()) v = v.slice(0, s) + t + v.slice(e);
      ta.value = v;
    }
  } finally { fixingRefs = false; }
  [a, b] = [shift(a), shift(b)];
  if (focused) ta.setSelectionRange(a, b);
  syncIds();
}

// 照査・打合せは必ず横に分ける。本線の手順や小項目として書かれていたら「@」の行に書き換える。
// 今打っている行、いちばん上の手順、小項目や並行が付いた手順、戻りの矢印・合流先になっている手順はそのまま
const NOTE_LINE_RE = /照査|打合|打ち合/;
// ①②…の番号を付けるのは、名前が「照査」「打合せ」だけのもの（「詳細設計照査」「現地打合せ」などには付けない）
const NUMBERED_NOTE_RE = /^(照査|打ち?合わ?せ?)$/;
// 名前の頭の「1.」「1.1.」などの番号
const ITEM_NUM_RE = /^[0-9０-９]+(?:[.．][0-9０-９]+)*[.．)）、:：]\s*/;
// 「@」の行では「、」「・」などが区切りなので、1 つの名前の中では見た目の近い別の字にしておく（読むときは元に戻す）
const noteSafe = t => t.replace(/・/g, "･").replace(/[、,，]/g, "､").replace(/[\/／]/g, "∕");
const noteUnsafe = t => t.replace(/･/g, "・").replace(/､/g, "、").replace(/∕/g, "／");
// 小項目の名前が「第1回」「2回目」「③」のような回数だけなら親の名前（打合せ①②…と番号が付く）、ほかは「打合せ（…）」
const COUNT_RE = /^(第\s*)?[0-9０-９]+\s*(回目?)?$|^[①-⑳]$|^[（(][0-9０-９]+[)）]$/;
const noteLabel = (head, sub) => (COUNT_RE.test(clean(sub)) ? head : NOTE_LINE_RE.test(sub) ? sub : `${head}（${sub}）`);
function convertNotes(num) {
  const { units, sides } = parse(ta.value, num, lineIds);
  const cur = document.activeElement === ta ? lineAt(ta.selectionStart) : -1;
  const strip = t => clean(clean(t).replace(ITEM_NUM_RE, ""));
  const keep = new Set(sides.map(sd => units.indexOf(sd.after)));
  units.forEach(u => (u.chain || []).forEach(c => { const t = findTarget(c, units); if (t.index >= 0) keep.add(t.index); }));
  sides.forEach(sd => { if (sd.target) { const t = findTarget(sd.target, units); if (t.index >= 0) keep.add(t.index); } });
  const change = [], drop = [];   // [行, 新しい名前（「、」で区切る）] と、消す行
  units.forEach((u, i) => {
    const subs = u.subs || [];
    if (i > 0 && u.kind === "proc" && !u.chain.length && !keep.has(i) && NOTE_LINE_RE.test(u.text) && u.line !== cur && !subs.some(sb => sb.line === cur)) {
      // 手順そのものが照査・打合せ：小項目があれば、それぞれを照査・打合せの箱にする
      const head = strip(u.text);
      change.push([u.line, subs.length ? subs.map(sb => noteSafe(noteLabel(head, strip(sb.text)))) : [noteSafe(head)]]);
      subs.forEach(sb => drop.push(sb.line));
      return;
    }
    subs.forEach(sb => { if (sb.line !== cur && NOTE_LINE_RE.test(sb.text)) change.push([sb.line, [noteSafe(strip(sb.text))]]); });
  });
  if (!change.length) return 0;
  if (!jumpRefs) rememberJumps(units);   // 書き換えでずれる「#番号」を付け直せるように
  const lines = ta.value.replace(/\r\n?/g, "\n").split("\n"), at = [0];
  lines.forEach((ln, i) => { at[i + 1] = at[i] + ln.length + 1; });
  const edits = change.map(([ln, items]) => [at[ln], at[ln] + lines[ln].length, `@${items.join("、")}`])
    .concat(drop.map(ln => (ln + 1 < lines.length ? [at[ln], at[ln + 1], ""] : [at[ln] - 1, at[ln] + lines[ln].length, ""])));
  applyEdits(edits.sort((x, y) => x[0] - y[0]));
  renumberJumps(num);
  return change.length;
}

function update() {
  if (fixingRefs) return;
  const o = options();
  syncIds();
  const fixed = renumberJumps(o.num);
  const notes = convertNotes(o.num);
  const { units, sides, lineInfo } = parse(ta.value, o.num, lineIds);
  rememberJumps(units);
  if (notes) toast(`照査・打合せの行を、横に分かれる形（@）に直しました（${notes} か所）。`);
  else if (fixed) toast(`手順の番号がずれたので、戻り先の番号（#）を ${fixed} か所付け直しました。`);
  const g = buildGraph(units, sides);
  const L = layout(g, o);
  const st = STYLES[o.style];
  state = { L, st, o, g, lineInfo };

  const errLines = new Set(g.msgs.filter(m => m.level === "warn").map(m => m.line));
  gutter.innerHTML = lineInfo.map((li, i) => {
    const kind = li.type === "step" || (li.type === "lane" && li.n) ? "step" : ["lane", "sub", "memo", "side"].includes(li.type) ? "lane" : "";
    const cls = [kind, errLines.has(i) ? "err" : ""].join(" ").trim();
    const label = li.n ? li.n : { lane: "∥", note: "※", sub: "・", memo: "@", side: "＜" }[li.type] || "";
    return `<div${cls ? ` class="${cls}"` : ""}>${label}</div>`;
  }).join("");
  gutter.scrollTop = ta.scrollTop;

  msgsEl.innerHTML = g.msgs.map(m =>
    `<div class="m ${m.level}">${m.line >= 0 ? `<b>${m.line + 1} 行目</b>` : ""}<span>${esc(m.text)}</span></div>`).join("");

  paper.style.aspectRatio = `${L.W} / ${L.H}`;
  paper.style.width = `${baseWidth() * zoom}px`;
  paper.innerHTML = svgOf(L, st, false);

  const jumps = g.edges.filter(e => e.type === "jump" || e.type === "merge").length;
  const decs = units.filter(u => u.kind === "dec").length;
  const pars = units.filter(u => u.kind === "block").length + sides.length;
  $("stats").innerHTML = g.M
    ? `手順 <span class="n">${g.M}</span>　判断 <span class="n">${decs}</span>　同時進行 <span class="n">${pars}</span>　合流・戻り <span class="n">${jumps}</span>`
    : "手順はまだありません";
  $("btnReset").hidden = !L.moved;
  $("btnShowLines").hidden = !L.hiddenLines;
  markCurrent();
  save();
}

function lineAt(pos) { return ta.value.slice(0, pos).split("\n").length - 1; }
function markCurrent() {
  const line = lineAt(ta.selectionStart);
  paper.querySelectorAll(".node").forEach(el => el.classList.toggle("cur", document.activeElement === ta && +el.dataset.line === line));
}

function save() {
  try {
    const o = { src: ta.value, offsets, rewires, lineIds, lineStyles };
    optIds.forEach(id => { o[id] = $(id).value; });
    localStorage.setItem("fc-tool-v1", JSON.stringify(o));
  } catch (e) { /* 保存できなくても動く */ }
}
function load() {
  let o = null;
  try { o = JSON.parse(localStorage.getItem("fc-tool-v1") || "null"); } catch (e) { o = null; }
  ta.value = o && typeof o.src === "string" ? o.src : "";   // はじめは白紙から
  if (o) optIds.forEach(id => { if (typeof o[id] === "string") $(id).value = o[id]; });
  if (o && o.offsets && typeof o.offsets === "object") offsets = o.offsets;
  if (o && o.rewires && typeof o.rewires === "object") rewires = o.rewires;
  if (o && o.lineStyles && typeof o.lineStyles === "object") lineStyles = o.lineStyles;
  if (o && Array.isArray(o.lineIds) && o.lineIds.length === ta.value.split("\n").length) {
    lineIds = o.lineIds;
    prevLines = ta.value.split("\n");
  }
  if (!o) { $("optSize").value = "a4p"; $("optStyle").value = "gyomu"; }
  if (!$("optSize").value) $("optSize").value = "w169";
  if (!$("optStyle").value) $("optStyle").value = "gyomu";
  if (!$("optFont").value) $("optFont").value = "meiryoui";
}

let toastTimer = 0;
function toast(text, actionLabel, action) {
  const t = $("toast");
  t.innerHTML = `<span>${esc(text)}</span>${actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : ""}`;
  if (actionLabel) t.querySelector("button").onclick = () => { t.hidden = true; action(); };
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, actionLabel ? 8000 : 4000);
}

async function saveFile(name, blob) {
  if (window.claude && typeof window.claude.use === "function") {
    const dl = await window.claude.use("downloads");
    if (dl) {
      try { await dl.save({ filename: name, data: blob }); return true; }
      catch (e) { if (e && e.code === "declined") return false; throw e; }
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return true;
}
function baseName() {
  const t = state.o.title || "フローチャート";
  return t.replace(/[\\/:*?"<>|]/g, "_").slice(0, 60);
}

async function savePptx() {
  if (!state.g.M) { toast("先に左の「手順」を書いてください。"); return; }
  const parts = pptxParts(state.L, state.st, FONTS[state.o.font][0]);
  const blob = new Blob([zipBytes(parts)], { type: "application/vnd.openxmlformats-officedocument.presentationml.presentation" });
  try {
    if (await saveFile(baseName() + ".pptx", blob)) toast("保存しました。開くと四角や矢印をそのまま編集できます。");
  } catch (e) {
    toast("保存できませんでした。もう一度押してみてください。");
  }
}

function pngBlob() {
  return new Promise((resolve, reject) => {
    const L = state.L, scale = 2;
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      cv.width = L.W * scale; cv.height = L.H * scale;
      const cx = cv.getContext("2d");
      cx.fillStyle = "#FFFFFF"; cx.fillRect(0, 0, cv.width, cv.height);
      cx.drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => (b ? resolve(b) : reject(new Error("png"))), "image/png");
    };
    img.onerror = reject;
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgOf(L, state.st, true));
  });
}
async function copyImage() {
  if (!state.g.M) { toast("先に左の「手順」を書いてください。"); return; }
  const p = pngBlob();
  try {
    await navigator.clipboard.write([new ClipboardItem({ "image/png": p })]);
    toast("画像をコピーしました。PowerPoint で Ctrl+V で貼り付けられます。");
  } catch (e) {
    try {
      if (await saveFile(baseName() + ".png", await p)) toast("コピーできなかったので、画像ファイルとして保存しました。");
    } catch (e2) {
      toast("画像を作れませんでした。「PowerPoint で保存」を使ってください。");
    }
  }
}

// 行の追加ボタン
function lineRange() {
  const v = ta.value, pos = ta.selectionStart;
  const s = v.lastIndexOf("\n", pos - 1) + 1;
  let e = v.indexOf("\n", pos); if (e < 0) e = v.length;
  return [s, e];
}
// from〜to を text に置き換える（Ctrl+Z で戻せる方法を優先）
function typeAt(from, to, text) {
  ta.focus();
  ta.setSelectionRange(from, to);
  let ok = false;
  try { ok = document.execCommand("insertText", false, text); } catch (e) { ok = false; }
  if (!ok) ta.setRangeText(text, from, to, "end");
}
function insertLine(text, selFrom, selLen) {
  const [s, e] = lineRange();
  let start;
  if (clean(ta.value.slice(s, e)) === "") { typeAt(s, e, text); start = s; }
  else { typeAt(e, e, "\n" + text); start = e + 1; }
  ta.setSelectionRange(start + selFrom, start + selFrom + selLen);
  update();
  commit();
}
function appendLine(text, selFrom, selLen) {
  const [, e] = lineRange();
  typeAt(e, e, text);
  ta.setSelectionRange(e + selFrom, e + selFrom + selLen);
  update();
  commit();
}
const INSERTS = {
  proc: () => insertLine("新しい作業", 0, 5),
  sub: () => insertLine("・小項目", 1, 3),
  memo: () => insertLine("@照査、打合せ", 1, 6),
  meet: () => insertLine("@打合せ", 1, 3),
  side: () => insertLine("< 並行する作業 > #1", 2, 6),
  branch: () => insertLine("@名前", 1, 2),
};
document.querySelectorAll("[data-ins]").forEach(b => b.addEventListener("click", () => INSERTS[b.dataset.ins]()));

$("sample").addEventListener("change", e => {
  const k = e.target.value;
  e.target.value = "";
  if (k !== "blank" && !SAMPLES[k]) return;
  commit();
  ta.value = k === "blank" ? "" : SAMPLES[k];
  jumpRefs = null;
  offsets = {};
  rewires = {};
  if (k === "word") { $("optSize").value = "a4p"; $("optStyle").value = "gyomu"; }
  update();
  commit();
  toast(k === "blank" ? "白紙にしました。" : "サンプルを入れました。", "元に戻す", undo);
  if (k === "blank") ta.focus();
});

// 文字の入力は、手を止めたところで 1 回分として記録する
let typingTimer = 0;
ta.addEventListener("input", () => { update(); clearTimeout(typingTimer); typingTimer = setTimeout(commit, 700); });
ta.addEventListener("scroll", () => { gutter.scrollTop = ta.scrollTop; });
["keyup", "click", "focus", "blur", "select"].forEach(ev => ta.addEventListener(ev, markCurrent));
ta.addEventListener("blur", () => { if (NOTE_LINE_RE.test(ta.value)) { update(); commit(); } });
optIds.forEach(id => {
  const sel = $(id).tagName === "SELECT";
  $(id).addEventListener(sel ? "change" : "input", () => { update(); if (sel) commit(); });
  if (!sel) $(id).addEventListener("change", commit);
});

let picked = null;   // 図をクリックして選んだ行（Delete でまとめて消す）
function selectLine(line) {
  const lines = ta.value.split("\n");
  if (line < 0 || line >= lines.length) return;
  let s = 0; for (let i = 0; i < line; i++) s += lines[i].length + 1;
  ta.focus();
  ta.setSelectionRange(s, s + lines[line].length);
  picked = { line, start: s, end: s + lines[line].length };
  const lh = parseFloat(getComputedStyle(ta).lineHeight) || 26;
  ta.scrollTop = Math.max(0, line * lh - ta.clientHeight / 3);
  markCurrent();
}

// 図で選んだ手順を Delete / BackSpace で消す（その下の「・小項目」「@照査…」の行も一緒に）
ta.addEventListener("keydown", e => {
  if (!picked || (e.key !== "Delete" && e.key !== "Backspace")) return;
  if (ta.selectionStart !== picked.start || ta.selectionEnd !== picked.end) { picked = null; return; }
  e.preventDefault();
  const lines = ta.value.split("\n"), info = state.lineInfo;
  let last = picked.line;
  if (info[picked.line] && ["step", "side"].includes(info[picked.line].type)) {
    while (last + 1 < lines.length && info[last + 1] && ["sub", "memo"].includes(info[last + 1].type)) last++;
  }
  let s = 0; for (let i = 0; i < picked.line; i++) s += lines[i].length + 1;
  let t = s; for (let i = picked.line; i <= last; i++) t += lines[i].length + 1;
  if (t > ta.value.length) { t = ta.value.length; if (s > 0) s--; }   // 最後の行は前の改行ごと消す
  const name = clean(lines[picked.line]);
  picked = null;
  typeAt(s, t, "");

  const ni = L.nodes.indexOf(n), sl = g.sideLanes.find(x => x.ids.includes(ni));
  if (!sl) return false;
  let a = sl.line, b = a;
  while (b + 1 < lines.length && lineInfo[b + 1] && ["side", "sub", "memo"].includes(lineInfo[b + 1].type)) b++;
  const region = lineIds.slice(a, b + 1), items = [], memos = [];
  let target = "";
  for (let i = a; i <= b; i++) {
    const type = lineInfo[i].type;
    if (type === "side") {
      const t = clean(lines[i]).replace(SIDE_RE, "").replace(/＞/g, ">"), p = t.indexOf(">");
      if (p >= 0 && clean(t.slice(p + 1).split(">")[0])) target = clean(t.slice(p + 1).split(">")[0]);
      const ps = (p >= 0 ? t.slice(0, p) : t).split(/→|->|⇒/).map(clean).filter(Boolean);
      ps.forEach(raw => items.push({ raw, id: ps.length === 1 ? lineIds[i] : newId(), subs: [] }));
    } else if (type === "sub" && items.length) items[items.length - 1].subs.push({ t: lines[i], id: lineIds[i] });
    else memos.push({ t: lines[i], id: lineIds[i] });
  }
  const k0 = sl.ids.indexOf(ni), it = items[k0];
  if (!it) return false;
  const to = target ? refsOf(`> ${target}`) : [];
  const sideRows = list => list.flatMap((x, i) => [{ t: `< ${x.raw}${i === 0 && target ? ` > ${target}` : ""}`, id: x.id }, ...x.subs]).concat(memos);
  let msg, main = null;
  if (!closerToMain(n)) {
    const kt = sl.ids.map(i => L.nodes[i]).filter(m => m !== n && m.y < n.y).length;
    if (kt === k0) return false;
    items.splice(k0, 1);
    items.splice(kt, 0, it);
    msg = `「${n.text}」を並行（左）の ${kt + 1} 番目に動かしました`;
  } else {
    items.splice(k0, 1);
    main = mainSlot(n.y);
    msg = `「${n.text}」を並行（左）から出して、手順にしました`;
  }
  const out = sideRows(items);
  editRows(rows => {
    if (main) insertAt(rows, main, [{ t: it.raw, id: newId() }, ...it.subs]);
    rows.splice(rowAt(rows, region[0]), region.length, ...out);
  });
  if (out.length && items.length) keepRefs(out[0].id, out[0].t, to);
  return dropDone(n.key, region, msg);
}

// 判断の右（「いいえ」のとき）の箱：同じ高さなら並べ替え、本線に寄せたら普通の手順にする
function dropChainItem(n) {
  const { g, L } = state, u = g.units[n.unit], id = lineIds[u.line];
  const t = ta.value.split("\n")[u.line].replace(/＞/g, ">"), p = t.indexOf(">");
  if (p < 0) return false;
  const head = clean(t.slice(0, p)), chain = t.slice(p + 1).split(">").map(clean).filter(Boolean);
  const c0 = n.col - 1, raw = chain[c0];
  if (raw == null) return false;
  const dn = L.nodes[g.entry[n.unit]];
  let msg, main = null;
  if (Math.abs(n.y - dn.y) < dn.h) {
    const kt = L.nodes.filter(m => m.side && m.unit === n.unit && m !== n && m.x < n.x).length;
    if (kt === c0) return false;
    chain.splice(c0, 1);
    chain.splice(kt, 0, raw);
    msg = `「${n.text}」を「${u.text}」の右の ${kt + 1} 番目に動かしました`;
  } else if (Math.abs(n.x - L.mainX) < n.w) {
    chain.splice(c0, 1);
    main = mainSlot(n.y);
    msg = `「${n.text}」を判断の右から出して、手順にしました`;
  } else return false;
  const nt = chain.length ? `${head} > ${chain.join(" > ")}` : head;
  const to = refsOf(nt);
  editRows(rows => {
    if (main) insertAt(rows, main, [{ t: raw, id: newId() }]);
    rows[rowAt(rows, id)].t = nt;
  });
  keepRefs(id, nt, to);
  return dropDone(n.key, [id], msg);
}

// 小項目：同じ手順の中なら並べ替え、別の箱の上ならその箱の小項目に、何もない所なら普通の手順にする
function dropSub(node, j, dx, dy) {
  const { L } = state, b = node.subBoxes[j], x = b.x + dx, y = b.y + dy;
  const inside = m => Math.abs(x - m.x) <= m.w / 2 && y >= topOf(m) && y <= bottomOf(m);
  if (inside(node)) return reorderSub(node, j, dy);
  const lines = ta.value.split("\n"), sub = node.subs[j], subId = lineIds[sub.line], raw = lines[sub.line];
  // 小項目を付けられる箱：本線の手順と、並行（左）の箱（その行のいちばん後ろの箱だけ）
  const canHold = m => {
    if (m === node || !isShape(m) || m.lane !== undefined || m.side) return false;
    if (!m.sideLane) return true;
    const t = clean(lines[m.line]).replace(SIDE_RE, "").replace(/＞/g, ">");
    return +m.uid.split("<").pop() === (t.split(">")[0].split(/→|->|⇒/).map(clean).filter(Boolean).length - 1);
  };
  const host = L.nodes.find(m => canHold(m) && inside(m));
  if (host) {
    const hs = host.subs || [], kt = (host.subBoxes || []).filter(sb => sb.y < y).length;
    const slot = !hs.length ? { after: lineIds[host.line] } : kt < hs.length ? { before: lineIds[hs[kt].line] } : { after: lineIds[hs[hs.length - 1].line] };
    editRows(rows => { insertAt(rows, slot, [{ t: raw, id: newId() }]); rows.splice(rowAt(rows, subId), 1); });
    return dropDone(node.key, [subId], `小項目「${sub.text}」を「${host.text}」の小項目にしました`);
  }
  const slot = mainSlot(y);
  editRows(rows => { insertAt(rows, slot, [{ t: clean(raw).replace(SUB_RE, ""), id: newId() }]); rows.splice(rowAt(rows, subId), 1); });
  return dropDone(node.key, [subId], `小項目「${sub.text}」を手順にしました`);
}

// 黒い点を動かしたとき：照査・打合せの点なら「@」の行を、並行（左）の点なら分かれる所・合流先を書き換える
function dropDot(key) {
  const { g, L, lineInfo } = state;
  const dot = L.dots.find(d => d.key === key);
  if (!dot) return false;
  const name = key.slice(1).replace(/\|\d+$/, "");
  if (name[0] !== "<" && name[0] !== ">") {
    const note = L.notes.find(n => n.uid && n.uid.startsWith(`${name}|n`));
    return note ? moveNoteByDrag(note.key, dot.y) : false;
  }
  // 並行（左）：点の高さのすぐ下にある手順
  const units = g.units, M = units.length;
  const below = units.findIndex((u, i) => topOf(L.nodes[g.entry[i]]) > dot.y);
  const uid = name.slice(1), sl = g.sideLanes.find(x => L.nodes[name[0] === "<" ? x.ids[0] : x.ids[x.ids.length - 1]].uid === uid);
  if (!sl) return false;
  const lines = ta.value.split("\n");
  let a = sl.line, b = a;
  while (b + 1 < lines.length && lineInfo[b + 1] && ["side", "sub", "memo"].includes(lineInfo[b + 1].type)) b++;
  const region = lineIds.slice(a, b + 1), sideIdx = [];
  for (let i = a; i <= b; i++) if (lineInfo[i].type === "side") sideIdx.push(i);
  const headOf = i => { const t = clean(lines[i]).replace(SIDE_RE, "").replace(/＞/g, ">"); const p = t.indexOf(">"); return clean(p >= 0 ? t.slice(0, p) : t); };
  // 合流先の書き方：名前が 1 つだけならその名前、ほかは #番号
  const nameOf = i => {
    const t = units[i].text;
    return units[i].kind !== "block" && t && !/^[#＃]/.test(t) && units.filter(u => u.kind !== "block" && u.text === t).length === 1 ? t : `#${i + 1}`;
  };
  let from = sl.from, to = sl.to < 0 ? M : sl.to, msg;
  if (name[0] === "<") {
    // 分かれる所：点のすぐ下の手順と並行して進む（その手順のかたまりの後ろに行を移す）
    const f = below < 0 ? M - 1 : below;
    if (f === from || units[f].kind === "block") return false;
    from = f;
    if (to <= from) to = from + 1;
    msg = `並行（左）を「${units[from].text}」から分かれるようにしました`;
  } else {
    // 合流先：点のすぐ下の手順
    const t = below < 0 ? M : below;
    if (t === to || t <= from) return false;
    to = t;
    msg = to < M ? `並行（左）の合流先を「${units[to].text || `#${to + 1}`}」にしました` : "並行（左）を最後まで合流しないようにしました";
  }
  const target = to === from + 1 || to >= M ? "" : nameOf(to);
  const refs = target.startsWith("#") ? refsOf(`> ${target}`) : [];
  const out = [];
  let first = true;
  for (let i = a; i <= b; i++) {
    if (lineInfo[i].type !== "side") { out.push({ t: lines[i], id: lineIds[i] }); continue; }
    out.push({ t: `< ${headOf(i)}${first && target ? ` > ${target}` : ""}`, id: lineIds[i] });
    first = false;
  }
  editRows(rows => {
    rows.splice(rowAt(rows, region[0]), region.length);
    if (name[0] === "<") insertAt(rows, { after: lineIds[(() => { let e = units[from].line; while (e + 1 < lineInfo.length && lineInfo[e + 1] && ["sub", "memo"].includes(lineInfo[e + 1].type)) e++; return e; })()] }, out);
    else rows.splice(rowAt(rows, lineIds[a - 1]) + 1, 0, ...out);
  });
  if (target.startsWith("#")) keepRefs(out.find(r => r.t.startsWith("<")).id, out.find(r => r.t.startsWith("<")).t, refs);
  return dropDone(key, [], msg);
}

// 小項目を上下にドラッグしたら、同じ手順の中で並べ替える（手順の欄の「・」の行も動かす）
function reorderSub(node, j, dy) {
  const subs = node.subs, boxes = node.subBoxes;
  const y = boxes[j].y + dy;
  let to = 0;
  boxes.forEach((b, k) => { if (k !== j && b.y < y) to++; });
  if (to === j) return false;
  const others = subs.filter((_, k) => k !== j);
  moveLine(subs[j].line, to < others.length ? others[to].line : others[others.length - 1].line + 1);
  update();
  commit();
  toast(`小項目「${subs[j].text}」を ${to + 1} 番目に並べ替えました（手順の欄も同じ順番です）。`, "元に戻す", undo);
  return true;
}

// 照査・打合せの箱を別の場所に動かしたら、手順の欄の「@」の行もそこへ動かす。
// 本線の反対側へ動かしたら、その箱だけ左右を入れ替える（行の頭が「@」⇔「@<」）
function moveNoteByDrag(key, atY) {
  const { g, L, lineInfo } = state;
  const note = L.notes.find(n => n.key === key);
  if (!note) return false;
  const y = atY ?? note.y;   // 点を動かしたときは点の高さで決める
  const units = g.units, nodeOf = i => L.nodes[g.entry[i]];
  // 置ける場所：見出しの横（小項目があるとき）、小項目の間、手順のあと
  const slots = [];
  units.forEach((u, i) => {
    const n = nodeOf(i), k = hasSubs(n) ? n.subs.length : 0;
    if (k) {
      slots.push({ unit: i, pos: 0, y: n.head.y });
      for (let j = 1; j < k; j++) slots.push({ unit: i, pos: j, y: (bottomOf(n.subBoxes[j - 1]) + topOf(n.subBoxes[j])) / 2 });
    }
    const ex = L.nodes[g.exit[i]], next = i + 1 < units.length ? nodeOf(i + 1) : null;
    slots.push({ unit: i, pos: k, y: next ? (bottomOf(ex) + topOf(next)) / 2 : bottomOf(ex) + 10 });
  });
  if (!slots.length) return false;
  const best = slots.reduce((a, b) => (Math.abs(b.y - y) < Math.abs(a.y - y) ? b : a));
  const cur = nodeOf(note.unit), k0 = hasSubs(cur) ? cur.subs.length : 0;
  const toLeft = atY === undefined && note.x < L.mainX, flip = atY === undefined && toLeft !== !!note.left;
  const same = best.unit === note.unit && best.pos === Math.min(note.pos, k0);
  if (same && !flip) return false;

  // 入れる行：見出しのすぐ下／(pos-1) 番目の小項目のすぐ下／その手順のかたまりの最後
  const u = units[best.unit], lines = ta.value.split("\n");
  let at;
  if (best.pos === 0 && hasSubs(nodeOf(best.unit))) at = u.line + 1;
  else if (best.pos < (nodeOf(best.unit).subs || []).length) at = u.subs[best.pos - 1].line + 1;
  else {
    at = u.line;
    while (at + 1 < lines.length && lineInfo[at + 1] && (["sub", "memo", "side"].includes(lineInfo[at + 1].type) || (lineInfo[at + 1].type === "lane" && !lineInfo[at + 1].n))) at++;
    at++;
  }
  const from = note.line, uid = lineIds[from], nl = noteLine(lines[from]);
  let label = nl.items.join("、");
  if (!flip) {
    if (at === from || at === from + 1) return false;
    moveLine(from, at);
  } else {
    // この箱だけ反対側へ。行き先に同じ側の「@」の行があればそこに足す（1 つの点にまとめる）
    const idx = +note.uid.split("|n").pop(), name = nl.items[idx], kb = (nodeOf(best.unit).subs || []).length;
    const dest = (units[best.unit].notes || []).find(nt => nt.line !== from && !!nt.left === toLeft && Math.min(nt.pos, kb) === best.pos);
    label = noteUnsafe(name);
    editRows(rows => {
      const single = nl.items.length === 1;
      let moving = { t: "", id: newId() };
      if (single) { moving = rows.splice(from, 1)[0]; if (at > from) at--; }
      else rows[from].t = noteRow(nl.items.filter((_, j) => j !== idx), nl.left);
      if (dest) {
        const d = rowAt(rows, lineIds[dest.line]), dl = noteLine(rows[d].t);
        rows[d].t = noteRow(dl.items.concat(name), toLeft);
      } else {
        moving.t = noteRow([name], toLeft);
        rows.splice(at, 0, moving);
      }
    });
  }
  // 新しい場所の並びに任せる（手で動かした分は消す）
  for (const k of Object.keys(offsets)) if (k.startsWith(`${uid}|n`) || k === `●${uid}` || k.startsWith(`●${uid}|`)) delete offsets[k];
  update();
  commit();
  const where = best.pos === 0 && hasSubs(nodeOf(best.unit)) ? "の見出しの横" : best.pos < (nodeOf(best.unit).subs || []).length ? `の小項目 ${best.pos} と ${best.pos + 1} の間` : "のあと";
  const unitName = units[best.unit].text || "同時進行";
  toast(flip ? `「${label}」を${toLeft ? "左" : "右"}側に移して、「${unitName}」${where}に付けました（手順の欄の @ の行も直しました）。`
    : `「${label}」を「${unitName}」${where}に動かしました（手順の欄の @ の行も動かしました）。`, "元に戻す", undo);
  return true;
}

// 一番近い矢印・図形のふちの上の点
// いちばん近い線の上の点
function nearestOn(p, segs) {
  let best = null, bd = Infinity;
  for (const [a, b] of segs) {
    const dx = b[0] - a[0], dy = b[1] - a[1], len2 = dx * dx + dy * dy || 1e-9;
    const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len2));
    const q = [a[0] + t * dx, a[1] + t * dy], d = Math.hypot(q[0] - p[0], q[1] - p[1]);
    if (d < bd) { bd = d; best = q; }
  }
  return best;
}
function snapPoint(p, segs) {
  const q = nearestOn(p, segs);
  return q && Math.hypot(q[0] - p[0], q[1] - p[1]) < 10 ? q : p;
}
paper.addEventListener("pointerdown", e => {
  const endEl = e.target.closest(".end");
  if (endEl && e.button === 0) { startEndDrag(endEl, e); return; }
  // 小項目は 1 つずつつかんで、同じ手順の中で上下に並べ替える
  const subEl = e.target.closest(".sub");
  if (subEl && e.button === 0) {
    const n = state.L.nodes[+subEl.closest(".node").dataset.i];
    drag = { sub: true, node: n, j: +subEl.dataset.sub, el: subEl, line: +subEl.dataset.line, key: n.key, start: svgPoint(e), moved: false, dx: 0, dy: 0 };
    e.preventDefault();
    return;
  }
  const dotEl = e.target.closest(".dot"), wireEl = e.target.closest(".wire");
  const el = dotEl || e.target.closest(".node") || wireEl;
  if (!el && e.button === 0 && zoom > 1) { startPan(e); return; }
  if (!el || e.button > 0) return;
  const n = dotEl ? state.L.dots[+dotEl.dataset.dot]
    : wireEl && el === wireEl ? state.L.lines[+wireEl.dataset.w]
    : el.dataset.note !== undefined ? state.L.notes[+el.dataset.note] : state.L.nodes[+el.dataset.i];
  drag = {
    key: n.key, line: el.dataset.line !== undefined ? +el.dataset.line : -1, start: svgPoint(e),
    base: (offsets[n.key] || [0, 0]).slice(), moved: false, dot: dotEl ? n : null, route: el === wireEl ? n.route : null,
    wire: el === wireEl, x: e.clientX, y: e.clientY, isNote: el.dataset.note !== undefined,
    box: !dotEl && el !== wireEl ? boxInfo(n) : null,
  };
  e.preventDefault();
});
window.addEventListener("pointermove", e => {
  if (pan) { movePan(e); return; }
  if (endDrag) { moveEndDrag(e); return; }
  if (!drag) return;
  const p = svgPoint(e), dx = p.x - drag.start.x, dy = p.y - drag.start.y;
  if (!drag.moved && Math.hypot(dx, dy) < 3) return;
  drag.moved = true;
  paper.classList.add("dragging");
  if (drag.sub) {
    // 小項目だけが動く（離したときに、落とした場所に合わせて手順の欄を書き換える）
    drag.dx = dx; drag.dy = dy;
    drag.el.setAttribute("transform", `translate(${f1(dx)} ${f1(dy)})`);
    drag.el.classList.add("moving");
    return;
  }
  if (drag.dot) {
    // 点は矢印や図形のふちの近くに来たら吸い付く
    const d = drag.dot, q = snapPoint([d.x0 + drag.base[0] + dx, d.y0 + drag.base[1] + dy], state.L.snap);
    offsets[drag.key] = [q[0] - d.x0, q[1] - d.y0];
  } else if (drag.wire && !["v3", "h3", "j4"].includes(drag.route)) {
    // まっすぐな矢印は、傾かないよう片方の向きだけに動かす。元の位置の近くでは元に戻る
    const ln = state.L.lines.find(l => l.key === drag.key);
    if (!ln || !ln.edge) return;
    const vert = drag.vert ?? (drag.vert = Math.abs(ln.S[0] - ln.E[0]) < 0.5);
    const k = paper.querySelector("svg").getScreenCTM().a;
    let v = (vert ? drag.base[0] + dx : drag.base[1] + dy);
    if (Math.abs(v) < 5 / k) v = 0;
    offsets[drag.key] = vert ? [v, 0] : [0, v];
  } else if (drag.box) {
    // 箱は上下の箱の中心・ふちや、縦に走る線にそろうと吸い付き、補助線を出す
    const b = drag.box, k = paper.querySelector("svg").getScreenCTM().a, th = 8 / k;
    let ox = drag.base[0] + dx, oy = drag.base[1] + dy;
    const cx = b.x0 + ox, cy = b.y0 + oy;
    const fit = (mine, others) => {
      let best = null;
      for (const m of mine) for (const o of others) {
        const dd = o - m;
        if (Math.abs(dd) < th && (!best || Math.abs(dd) < Math.abs(best.d))) best = { d: dd, at: o };
      }
      return best;
    };
    // 線を辺の真ん中に通すそろえを優先し、なければ箱どうしでそろえる
    const fx = fit([cx], b.lineXs) || fit([cx, cx - b.w / 2, cx + b.w / 2], b.xs);
    const fy = fit([cy], b.ys);
    if (fx) ox += fx.d;
    if (fy) oy += fy.d;
    [ox, oy] = keepStraight(b, ox, oy, b.w * 0.9);
    dragGuides = { x: fx ? fx.at : null, y: fy ? fy.at : null };
    offsets[drag.key] = [ox, oy];
  } else {
    // 線は曲がる向きにだけ動く
    offsets[drag.key] = [drag.base[0] + (drag.route === "v3" ? 0 : dx), drag.base[1] + (drag.route === "h3" ? 0 : dy)];
  }
  if (!dragFrame) dragFrame = requestAnimationFrame(() => { dragFrame = 0; update(); });
});
window.addEventListener("pointerup", e => {
  if (pan) { pan = null; scroller.classList.remove("panning"); return; }
  if (endDrag) { finishEndDrag(e); return; }
  if (!drag) return;
  const d = drag;
  drag = null;
  paper.classList.remove("dragging");
  if (dragFrame) { cancelAnimationFrame(dragFrame); dragFrame = 0; if (!dragGuides) update(); }
  if (dragGuides) { dragGuides = null; update(); }
  if (d.sub) {
    if (!d.moved) selectLine(d.line);
    else if (!dropSub(d.node, d.j, d.dx, d.dy)) update();
    return;
  }
  if (d.moved && d.dot && dropDot(d.key)) return;
  if (d.moved && d.isNote && moveNoteByDrag(d.key)) return;
  if (d.moved && !d.dot && !d.wire && d.box && dropBox(d.key)) return;
  if (d.moved && d.box && offsets[d.key]) {
    const [ox, oy] = offsets[d.key], [nx, ny] = keepStraight(d.box, ox, oy, Infinity);
    if (Math.abs(nx - ox) > 0.01 || Math.abs(ny - oy) > 0.01) { offsets[d.key] = [nx, ny]; update(); }
  }
  if (d.moved) commit();
  else if (d.wire) showLinePop(d.key, d.x, d.y);
  else if (d.line >= 0) selectLine(d.line);
});
$("btnReset").addEventListener("click", () => {
  offsets = {};
  rewires = {};
  update();
  commit();
  toast("配置と矢印の付け替えを元に戻しました。", "元に戻す", undo);
});

$("btnSave").addEventListener("click", savePptx);
$("btnCopy").addEventListener("click", copyImage);
// ---------- 元に戻す・やり直す ----------
// 文章・設定・動かした位置・付け替えた矢印をまとめて 1 回分として記録する（最大 100 回）
const past = [], future = [];
let current = "";
function snapshot() {
  return JSON.stringify({ src: ta.value, offsets, rewires, lineIds, lineStyles, opts: optIds.map(id => $(id).value) });
}
function refreshUndo() {
  $("btnUndo").disabled = !past.length && snapshot() === current;
  $("btnRedo").disabled = !future.length;
}
function commit() {
  clearTimeout(typingTimer);
  const now = snapshot();
  if (now !== current) {
    past.push(current);
    if (past.length > 100) past.shift();
    future.length = 0;
    current = now;
  }
  refreshUndo();
}
function restore(snap) {
  const o = JSON.parse(snap);
  ta.value = o.src;
  jumpRefs = null;
  if (o.lineIds) { lineIds = o.lineIds; prevLines = o.src.split("\n"); }
  offsets = o.offsets;
  rewires = o.rewires;
  lineStyles = o.lineStyles || {};
  optIds.forEach((id, i) => { $(id).value = o.opts[i]; });
  current = snap;
  update();
  refreshUndo();
}
function undo() {
  commit();
  if (!past.length) return;
  future.push(current);
  restore(past.pop());
  toast("1 つ前に戻しました。", "やり直す", redo);
}
function redo() {
  if (!future.length) return;
  past.push(current);
  restore(future.pop());
  toast("やり直しました。", "元に戻す", undo);
}
$("btnUndo").addEventListener("click", undo);
$("btnRedo").addEventListener("click", redo);

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === "s") { e.preventDefault(); savePptx(); return; }
  // 文字を入力している欄の中では、その欄の Ctrl+Z を使う
  const inField = /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName);
  if (mod && !inField && (k === "z" || k === "y")) {
    e.preventDefault();
    if (k === "y" || e.shiftKey) redo(); else undo();
  }
});

load();
update();
current = snapshot();
refreshUndo();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(update);
</script>
